name: Core Diagnostics

on:
  pull_request:
    paths:
      - "src/hardware_splicer/**"
      - "tests/**"
      - "scripts/**"
      - "examples/**"
      - "Makefile"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/core-diagnostics.yml"

jobs:
  engineering-core:
    name: Engineering core fast bar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Compile engineering package
        run: python -m compileall -q src/hardware_splicer
      - name: Focused engineering, mechanics, and evidence tests
        env:
          HARDWARE_SPLICER_SKIP_VISION_LIVE: "1"
        run: |
          PYTHONPATH=src python -m pytest -q \
            tests/test_canonical_product_route_composition.py \
            tests/test_extended_product_api.py \
            tests/test_engineering_action.py \
            tests/test_engineering_action_api.py \
            tests/test_engineering_action_mechanical_release_payload.py \
            tests/test_engineering_execution.py \
            tests/test_engineering_execution_api.py \
            tests/test_engineering_execution_capability.py \
            tests/test_engineering_execution_capability_api.py \
            tests/test_engineering_revision_diff.py \
            tests/test_engineering_revision_api.py \
            tests/test_engineering_revision_mechanical_physical_changes.py \
            tests/test_engineering_status.py \
            tests/test_engineering_status_api.py \
            tests/test_engineering_status_physical_audit.py \
            tests/test_engineering_status_attestation_revalidation.py \
            tests/test_manufacturing_closure.py \
            tests/test_manufacturing_api.py \
            tests/test_mechanical_api.py \
            tests/test_mechanical_fit.py \
            tests/test_mechanical_fit_plan_update.py \
            tests/test_mechanical_geometry_plan_update.py \
            tests/test_step_geometry.py \
            tests/test_physical_evidence.py \
            tests/test_physical_evidence_api.py \
            tests/test_physical_evidence_bytes.py \
            tests/test_physical_evidence_hash_api.py \
            tests/test_physical_evidence_attestation.py \
            tests/test_physical_evidence_attestation_api.py \
            tests/test_physical_evidence_attested_api.py \
            tests/test_physical_evidence_persistence_api.py \
            tests/test_audited_physical_evidence.py \
            tests/test_audited_physical_evidence_api.py \
            tests/test_audited_physical_evidence_persistence_api.py \
            tests/test_attested_audited_physical_evidence.py \
            tests/test_attested_physical_evidence_persistence_api.py \
            tests/test_attested_envelope_build_bounds.py \
            tests/test_audited_history_continuity.py \
            tests/test_authorization_ledger_chronology.py \
            tests/test_audited_compatibility_activation.py \
            tests/test_product_api_launcher_contract.py

  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install KiCad 9 CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get install --install-recommends -y kicad
      - name: Bootstrap
        run: make setup
      - name: Focused project review tests
        if: ${{ !cancelled() }}
        run: |
          source .venv/bin/activate
          PYTHONPATH=src pytest -q \
            tests/test_project_review_store.py \
            tests/test_project_review_api.py \
            tests/test_project_store.py \
            tests/test_project_api.py \
            tests/test_product_api_projects.py
      - name: Full Python test suite
        if: ${{ !cancelled() }}
        env:
          HARDWARE_SPLICER_SKIP_VISION_LIVE: "1"
        run: |
          source .venv/bin/activate
          make test
      - name: Golden intake tests
        if: ${{ !cancelled() }}
        run: |
          source .venv/bin/activate
          make test-golden-intakes
      - name: Backend benchmark
        if: ${{ !cancelled() }}
        run: |
          source .venv/bin/activate
          make benchmark-backend
      - name: Functional delivery audit
        if: ${{ !cancelled() }}
        run: |
          source .venv/bin/activate
          make audit-functional-delivery
      - name: Intake tier scoring
        if: ${{ !cancelled() }}
        run: |
          source .venv/bin/activate
          make score-intake-tiers
      - name: Splice verification
        if: ${{ !cancelled() }}
        run: |
          source .venv/bin/activate
          make verify-splice
      - name: End-to-end smoke
        if: ${{ !cancelled() }}
        run: |
          source .venv/bin/activate
          make smoke
