name: SPI Derived Virtual Lab

on:
  pull_request:
    paths:
      - "src/hardware_splicer/spi_derived_virtual_lab.py"
      - "src/hardware_splicer/spi_derived_lab_source_manifest.py"
      - "scripts/run_spi_derived_virtual_lab.py"
      - "scripts/run_spi_derived_virtual_lab_results.py"
      - "scripts/audit_spi_derived_virtual_lab.py"
      - "scripts/run_spi_reference_verilog.py"
      - "examples/derived_virtual_lab/**"
      - "tests/test_spi_derived_virtual_lab.py"
      - "docs/SPI_DERIVED_VIRTUAL_LAB.md"
      - ".github/workflows/spi-derived-virtual-lab.yml"
  workflow_dispatch:

concurrency:
  group: spi-derived-virtual-lab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  derived-virtual-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Hardware Splicer and tests
        run: python -m pip install -e '.[dev]'
      - name: Install Icarus Verilog reference simulator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends iverilog
      - name: Run focused Derived Virtual Lab tests
        run: pytest -q tests/test_spi_derived_virtual_lab.py
      - name: Execute frozen 512-case benchmark
        run: |
          mkdir -p artifacts/derived_virtual_lab
          python scripts/run_spi_derived_virtual_lab.py \
            --report-out artifacts/derived_virtual_lab/report.json \
            --corpus-out artifacts/derived_virtual_lab/corpus.json \
            --source-manifest-out artifacts/derived_virtual_lab/source_manifest.json
      - name: Export all per-case evaluator results
        run: |
          python scripts/run_spi_derived_virtual_lab_results.py \
            --out artifacts/derived_virtual_lab/results.json
      - name: Independently audit gold labels and evaluator outputs
        run: |
          python scripts/audit_spi_derived_virtual_lab.py \
            --corpus artifacts/derived_virtual_lab/corpus.json \
            --results artifacts/derived_virtual_lab/results.json \
            --benchmark-report artifacts/derived_virtual_lab/report.json \
            --out artifacts/derived_virtual_lab/independent_audit.json
      - name: Cross-check read-only SPI oracle with Icarus Verilog
        run: |
          python scripts/run_spi_reference_verilog.py \
            --report-out artifacts/derived_virtual_lab/verilog_reference_report.json
      - name: Upload deterministic experiment outputs
        uses: actions/upload-artifact@v4
        with:
          name: spi-derived-virtual-lab-v1
          path: artifacts/derived_virtual_lab/
          if-no-files-found: error
          retention-days: 30
