name: Integrate Anchor Intent Onto PR

on:
  push:
    branches:
      - feat/machine-workbench-v0-20260829
    paths:
      - .github/workflows/integrate-anchor-intent-onto-pr.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/machine-workbench-v0-20260829
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply validated anchor-intent delta
        run: |
          set -euo pipefail
          git diff --quiet b59ea22409294410c1ac386d01dc1bebb3fd37b2 HEAD -- . ':(exclude).github/workflows/integrate-anchor-intent-onto-pr.yml'
          git fetch origin feat/workbench-anchor-intent-persistence-v0
          git cherry-pick --no-commit \
            5058415352f00f34ec196f545dbf8e55c1171a09 \
            8cf32bb8b5c95c19a587819fceddb860c5ceecf7 \
            eb15015fd35e5ec80e5ad2a9c06ac96874c35454 \
            df10a9fac98c6c8744b219edc3fc5a6cb95aae70 \
            72513bd58b32debbcd60b6876252d14a4bddc769 \
            7db5154afff9feefb75c5f3ed3f0917caa17dca8 \
            52fa02371e36c17b8050ae150f6091b708928acb \
            e0c02f8e645cd70cc72fc47fa9780b1ee786e1f4 \
            e0880b03f345a0967b3244cd15e222acb346d017 \
            a5d8bb8e65d13ee63264e2020bc04c1d75d7133c \
            09529157596f648db87c9da9aff1cadc93337aad \
            66e94775429623d20377a0089061ae294e8e05e7 \
            552c377568864511ec6003440f3d30e24b6fad8e

          git show 4cc9610c523b2e0d97eb34fbdb0a7c4f87f98aa1:apps/circuit-ai/circuit-ai-frontend/e2e/machine-project-bound-brep-durability.spec.js > apps/circuit-ai/circuit-ai-frontend/e2e/machine-project-bound-brep-durability.spec.js
          git show 4cc9610c523b2e0d97eb34fbdb0a7c4f87f98aa1:.github/workflows/machine-workbench-frontend.yml > .github/workflows/machine-workbench-frontend.yml
          sed -i '/Validation marker: repaired durable BREP/d' .github/workflows/machine-workbench-frontend.yml
          sed -i '/feat\/workbench-anchor-intent-persistence-v0/d' .github/workflows/machine-workbench-frontend.yml

          git diff --check
          python -m py_compile \
            src/hardware_splicer/workbench_anchor_intent_api.py \
            src/hardware_splicer/workbench_placement_api.py \
            src/hardware_splicer/workbench_step_binding_api.py \
            src/hardware_splicer/product_api.py
          node --check apps/circuit-ai/circuit-ai-frontend/e2e/machine-project-anchor-intent-persistence.spec.js
          node --check apps/circuit-ai/circuit-ai-frontend/e2e/machine-project-bound-brep-durability.spec.js
          test -f apps/circuit-ai/circuit-ai-frontend/components/workbench/workbench-anchor-intent-rehydrator.tsx
          test -f apps/circuit-ai/circuit-ai-frontend/app/api/proxy/engineering/projects/'[projectId]'/workbench/anchor-intents/route.ts
          test -f apps/circuit-ai/circuit-ai-frontend/app/api/proxy/engineering/projects/'[projectId]'/workbench/anchor-intents/clear/route.ts
          grep -q 'requires_occt_resnap_on_reopen' src/hardware_splicer/workbench_anchor_intent_api.py
          grep -q 'kernel_result_persisted.*False' src/hardware_splicer/workbench_anchor_intent_api.py
          grep -q 'machine-project-anchor-intent-persistence.spec.js' .github/workflows/machine-workbench-frontend.yml
      - name: Commit integrated slice
        run: |
          set -euo pipefail
          git config user.name 'hardware-splicer-integration-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git reset .github/workflows/integrate-anchor-intent-onto-pr.yml
          git diff --cached --check
          git commit -m 'Persist and re-snap durable BREP anchor intent'
          git push origin HEAD:feat/machine-workbench-v0-20260829
