name: PF-002 BenchHMI qualification

on:
  pull_request:
    paths:
      - "hardware/reference_designs/benchhmi_v0/**"
      - "experiments/product_factory/qualify_pf002_donor.py"
      - "experiments/product_factory/advance_pf002.py"
      - "experiments/product_factory/fixtures/benchhmi_pos462_*.json"
      - "tests/test_product_factory_benchhmi_qualification.py"
      - ".github/workflows/pf002-benchhmi-qualification.yml"

jobs:
  donor-rehearsal:
    name: PF-002 fail-closed donor rehearsal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HS test environment
        run: python -m pip install -e ".[dev]"
      - name: Run qualification and pre-schematic tests
        run: python -m pytest -q tests/test_product_factory_benchhmi_qualification.py tests/test_benchio_pre_schematic.py tests/test_benchio_pinmap.py
      - name: Validate frozen BenchIO MCU pin map
        run: python hardware/reference_designs/benchhmi_v0/validate_benchio_pinmap.py hardware/reference_designs/benchhmi_v0/benchio_pinmap_v0.json
      - name: Rehearse perfect simulated donor
        run: |
          python experiments/product_factory/qualify_pf002_donor.py             experiments/product_factory/fixtures/benchhmi_pos462_simulated_pass.json             --output /tmp/pf002_donor.json
          python experiments/product_factory/advance_pf002.py             experiments/product_factory/fixtures/benchhmi_pos462_simulated_pass.json             --output /tmp/pf002_campaign.json
          cat /tmp/pf002_donor.json
          cat /tmp/pf002_campaign.json
          grep -q '"decision": "SIMULATION_REHEARSAL_COMPLETE_REAL_EVIDENCE_PENDING"' /tmp/pf002_donor.json
          grep -q '"benchio_schematic_design_authorized": true' /tmp/pf002_campaign.json
          grep -q '"benchio_system_integration_authorized": false' /tmp/pf002_campaign.json
          grep -q '"fabrication_authorized": false' /tmp/pf002_campaign.json
          grep -q '"blockers": \[\]' /tmp/pf002_donor.json
          grep -q '"real_physical_evidence_required"' /tmp/pf002_donor.json
