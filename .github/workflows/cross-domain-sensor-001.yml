name: Cross-Domain Sensor 001 Evidence

on:
  pull_request:
    paths:
      - "scripts/generate_cross_domain_sensor_001.py"
      - "tests/test_cross_domain_sensor_001.py"
      - "src/hardware_splicer/device_plan.py"
      - "src/hardware_splicer/device_application.py"
      - "apps/mecha-splicer/src/**"
      - ".github/workflows/cross-domain-sensor-001.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install HS dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run cross-domain behavioral tests
        run: pytest -q tests/test_cross_domain_sensor_001.py
      - name: Generate actual cross-domain artifact outputs
        run: python scripts/generate_cross_domain_sensor_001.py --output .cache/hs-cross-domain-sensor-001
      - name: Verify file hashes, design authority and provenance
        shell: python
        run: |
          import hashlib
          import json
          from pathlib import Path

          root = Path(".cache/hs-cross-domain-sensor-001")
          record = json.loads((root / "CROSS_DOMAIN_RECEIPT.json").read_text())
          assert record["revision_consistent"] is True
          assert record["firmware_package_status"] == "HOST_TESTABLE_PROPOSAL"
          for name, metadata in record["artifacts"].items():
              body = (root / name).read_bytes()
              assert len(body) == metadata["bytes"]
              assert hashlib.sha256(body).hexdigest() == metadata["sha256"]
          for gate in ("fabrication_authorized", "flashing_authorized",
                       "power_on_authorized", "device_physically_assembled"):
              assert record[gate] is False
          print("Cross-domain source artifacts and digest provenance verified; no physical authority.")
      - name: Compile and execute generated firmware host harness
        shell: python
        run: |
          import json
          import subprocess
          import zipfile
          from pathlib import Path

          target = Path(".cache/hs-cross-domain-sensor-001")
          extracted = Path(".cache/hs-cross-domain-host-test")
          extracted.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(target / "FIRMWARE_SOURCE.zip") as bundle:
              bundle.extractall(extracted)
          compile_cmd = ["g++", "-std=c++17", "-Wall", "-Wextra", "-Werror",
                         "-I", "src", "test/host/harness.cpp", "-o", "host-harness"]
          compiled = subprocess.run(compile_cmd, cwd=extracted, capture_output=True, text=True, timeout=60)
          report = {
              "kind": "generated_firmware_host_model_test",
              "compiler_command": compile_cmd,
              "compiler_returncode": compiled.returncode,
              "compiler_stderr": compiled.stderr[-2500:],
              "hardware_executed": False,
              "real_firmware_flashing": False,
              "physical_behavior_verified": False,
          }
          if compiled.returncode == 0:
              ran = subprocess.run(["./host-harness"], cwd=extracted,
                                   capture_output=True, text=True, timeout=60)
              report["harness_returncode"] = ran.returncode
              report["stdout_tail"] = ran.stdout[-3000:]
              report["stderr_tail"] = ran.stderr[-1500:]
          (target / "HOST_HARNESS_EVIDENCE.json").write_text(json.dumps(report, indent=2) + "\n")
          assert compiled.returncode == 0, compiled.stderr[-2500:]
          assert report["harness_returncode"] == 0, report.get("stderr_tail")
          print("Generated firmware host behavioral harness passed; no real hardware involved.")
      - name: Publish candidate artifacts for independent inspection
        uses: actions/upload-artifact@v4
        with:
          name: hs-cross-domain-sensor-001
          path: .cache/hs-cross-domain-sensor-001/
          retention-days: 14
          if-no-files-found: error
