name: AI Tool Preview Executor

on:
  workflow_dispatch:
  push:
    paths:
      - "src/hardware_splicer/ai_project_tool_executor.py"
      - "src/hardware_splicer/ai_project_tool_executor_api.py"
      - "src/hardware_splicer/product_api.py"
      - "tests/test_ai_project_tool_executor.py"
      - "tests/test_ai_project_tool_executor_api.py"
      - "tests/test_ai_project_tool_executor_product_api.py"
      - "docs/AI_TOOL_PREVIEW_EXECUTOR.md"
      - ".github/workflows/ai-tool-preview-executor.yml"
  pull_request:
    paths:
      - "src/hardware_splicer/ai_project_tool_executor.py"
      - "src/hardware_splicer/ai_project_tool_executor_api.py"
      - "src/hardware_splicer/product_api.py"
      - "tests/test_ai_project_tool_executor.py"
      - "tests/test_ai_project_tool_executor_api.py"
      - "tests/test_ai_project_tool_executor_product_api.py"
      - "docs/AI_TOOL_PREVIEW_EXECUTOR.md"
      - ".github/workflows/ai-tool-preview-executor.yml"

jobs:
  preview-contract:
    name: Accepted software preview contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HARDWARE_SPLICER_SKIP_VISION_LIVE: "1"
      HARDWARE_SPLICER_OFFLINE_LLM: "1"
      HARDWARE_SPLICER_OFFLINE_VISION: "1"
      HARDWARE_SPLICER_OFFLINE_SALVAGE: "1"
      QWEN_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Hardware Splicer and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Compile AI preview executor modules
        run: |
          python -m py_compile \
            src/hardware_splicer/ai_project_tool_executor.py \
            src/hardware_splicer/ai_project_tool_executor_api.py \
            src/hardware_splicer/product_api.py
      - name: Run preview executor contracts
        run: |
          PYTHONPATH=src python -m pytest -q \
            tests/test_ai_project_tool_executor.py \
            tests/test_ai_project_tool_executor_api.py \
            tests/test_ai_project_tool_executor_product_api.py \
            tests/test_ai_project_orchestrator.py \
            tests/test_ai_project_orchestrator_api.py
