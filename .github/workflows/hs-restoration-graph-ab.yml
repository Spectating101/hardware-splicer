name: HS graph-assisted restoration A/B
on:
  pull_request:
    paths:
      - 'src/hardware_splicer/restoration_engineering_assist.py'
      - 'src/hardware_splicer/restoration_reasoning_agent.py'
      - 'examples/restoration_video_bench/diversity/run_graph_ab.py'
      - 'examples/restoration_video_bench/diversity/GRAPH_AB.md'
      - 'examples/restoration_video_bench/diversity/evidence/graph_ab_six_live.json'
      - 'tests/test_restoration_graph_ab.py'
      - '.github/workflows/hs-restoration-graph-ab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof-of-source-and-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . 'pytest>=8,<10'
      - name: Verify native HS source graph, source bounds and LLM contracts
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q \
            tests/test_restoration_graph_ab.py \
            tests/test_restoration_reasoning_agent.py \
            tests/test_restoration_live_receipts.py
      - name: Check frozen A/B evidence without live inference
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('examples/restoration_video_bench/diversity/evidence/graph_ab_six_live.json')
          if not p.exists():
              print('A/B preregistered; result collection not yet complete')
          else:
              d=json.loads(p.read_text())
              assert d['complete'] and len(d['cases']) == 6
              assert d['protocol']['outcomes_not_loaded']
              for c in d['cases']:
                  for arm in ('plain','hs_graph'):
                      r=c['arms'][arm]['receipt']
                      assert r['evidence_sha256'] == c['identical_evidence_sha256']
                      assert r['repair_authorized'] is False
                      assert r['actual_video_frames_analyzed'] is False
                  assert c['arms']['plain']['receipt']['model_requested']==c['arms']['hs_graph']['receipt']['model_requested']
          PY
