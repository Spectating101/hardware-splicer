name: HS CM5 - Real 300-Contact SoM and Power USB Schematic Integration

on:
  pull_request:
    paths:
      - 'scripts/hs_cm5_integrated_power_usb_schematic.py'
      - 'src/hardware_splicer/cm5_integrated_reference_gate.py'
      - 'tests/test_cm5_integrated_reference_gate.py'
      - 'examples/cyberdeck/compute_carrier/cm5_reference/integrated_candidate/**'
      - '.github/workflows/hs-cm5-integrated-power-usb-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-native-kicad-connector-to-power-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HS regression dependencies
        run: python -m pip install -e . 'pytest>=8,<10'
      - name: Check entire CM5 manufacturer/source/design chain
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q \
            tests/test_compute_carrier_reference_gate.py \
            tests/test_cm5_pinout_audit.py \
            tests/test_cm5_reference_board_netmap.py \
            tests/test_cm5_connected_bench_schematic.py \
            tests/test_cm5_power_usb_reference_gate.py \
            tests/test_cm5_sgm2590_successor_gate.py \
            tests/test_cm5_integrated_reference_gate.py
      - name: Assert native 300-pin CM5 integration against original KiCad nets
        env:
          PYTHONPATH: src
        run: |
          python -m hardware_splicer.cm5_integrated_reference_gate \
            --integrated examples/cyberdeck/compute_carrier/cm5_reference/integrated_candidate/INTEGRATED_NATIVE_NETLIST.xml \
            --reference examples/cyberdeck/compute_carrier/cm5_reference/sgm2590_candidate/CM5_SGM2590_NATIVE_NETLIST.xml \
            --pinout examples/cyberdeck/compute_carrier/cm5_reference/vendor_pin_names.json \
            --erc examples/cyberdeck/compute_carrier/cm5_reference/integrated_candidate/INTEGRATED_ERC_OPEN.txt \
            --manifest examples/cyberdeck/compute_carrier/cm5_reference/integrated_candidate/integration_manifest.json \
            --output /tmp/cm5_integration_receipt.json
          cmp /tmp/cm5_integration_receipt.json \
            examples/cyberdeck/compute_carrier/cm5_reference/integrated_candidate/integrated_validation.json
          python - <<'PY'
          import json
          obj=json.load(open('/tmp/cm5_integration_receipt.json'))
          assert obj['real_cm5_symbol_pin_count']==300
          assert obj['physical_ground_pins']==76
          assert obj['physical_vcc_sysin_pins']==[77,79,81,83,85,87]
          assert obj['physical_usb_power_enable_pins']==[97]
          assert obj['physical_usb_dp_pins']==[263]
          assert obj['physical_usb_dm_pins']==[265]
          assert obj['pin290_held_nc']
          assert obj['upstream_power_usb_circuit_unchanged']
          assert not obj['erc_clean']
          assert not obj['fabrication_authorized']
          PY
      - name: Retain full 300-contact KiCad study and independent native netlist
        uses: actions/upload-artifact@v4
        with:
          name: HS-CM5-300-PIN-INTEGRATED-CIRCUIT-NO-FAB
          retention-days: 30
          path: |
            examples/cyberdeck/compute_carrier/cm5_reference/integrated_candidate/CM5_FULL_SYMBOL_POWER_USB_NOT_FOR_FAB.kicad_sch
            examples/cyberdeck/compute_carrier/cm5_reference/integrated_candidate/INTEGRATED_NATIVE_NETLIST.xml
            examples/cyberdeck/compute_carrier/cm5_reference/integrated_candidate/INTEGRATED_ERC_OPEN.txt
            /tmp/cm5_integration_receipt.json
