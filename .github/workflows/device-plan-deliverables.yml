name: Device Plan Deliverables

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/hardware_splicer/**'
      - 'tests/test_device*.py'
      - 'tests/test_firmware_scaffold.py'
      - 'scripts/verify_device*.py'
      - 'scripts/verify_device_frontend.sh'
      - 'scripts/mock*backend.py'
      - 'apps/circuit-ai/circuit-ai-frontend/app/**'
      - 'apps/circuit-ai/circuit-ai-frontend/components/**'
      - 'apps/circuit-ai/circuit-ai-frontend/lib/**'
      - 'apps/circuit-ai/circuit-ai-frontend/e2e/**'
      - 'apps/circuit-ai/circuit-ai-frontend/playwright.device.config.cjs'
      - 'apps/circuit-ai/circuit-ai-frontend/package*.json'
      - 'apps/circuit-ai/circuit-ai-frontend/next.config.*'
      - 'apps/circuit-ai/circuit-ai-frontend/tsconfig.json'
      - 'pyproject.toml'
      - '.github/workflows/device-plan-deliverables.yml'
  pull_request:
    paths:
      - 'src/hardware_splicer/**'
      - 'tests/test_device*.py'
      - 'tests/test_firmware_scaffold.py'
      - 'scripts/verify_device*.py'
      - 'scripts/verify_device_frontend.sh'
      - 'scripts/mock*backend.py'
      - 'apps/circuit-ai/circuit-ai-frontend/app/**'
      - 'apps/circuit-ai/circuit-ai-frontend/components/**'
      - 'apps/circuit-ai/circuit-ai-frontend/lib/**'
      - 'apps/circuit-ai/circuit-ai-frontend/e2e/**'
      - 'apps/circuit-ai/circuit-ai-frontend/playwright.device.config.cjs'
      - 'apps/circuit-ai/circuit-ai-frontend/package*.json'
      - 'apps/circuit-ai/circuit-ai-frontend/next.config.*'
      - 'apps/circuit-ai/circuit-ai-frontend/tsconfig.json'
      - 'pyproject.toml'
      - '.github/workflows/device-plan-deliverables.yml'

permissions:
  contents: read

jobs:
  browser:
    name: Device and evidence browser checks (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        backend: [real, mock]
    env:
      HARDWARE_SPLICER_OFFLINE_LLM: '1'
      HARDWARE_SPLICER_OFFLINE_VISION: '1'
      HARDWARE_SPLICER_OFFLINE_SALVAGE: '1'
      HS_PLAYWRIGHT_ROOT: ${{ github.workspace }}/.cache/hs-playwright
    steps:
      - uses: actions/checkout@v4
      - name: Install KiCad 9 lookup libraries used by the broader browser checks
        if: matrix.backend == 'mock'
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends kicad-symbols kicad-footprints
          test -f /usr/share/kicad/symbols/Timer.kicad_sym
          test -d /usr/share/kicad/footprints/Package_DIP.pretty
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated backend and run focused regression checks
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e '.[dev]'
          PYTHONPATH=src .venv/bin/python -m pytest -q tests/test_device_plan.py tests/test_device_reclaim.py tests/test_device_quote_audit.py tests/test_device_firmware.py tests/test_firmware_scaffold.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/circuit-ai/circuit-ai-frontend/package-lock.json
      - name: Install locked frontend and pinned headless browser
        run: |
          npm ci --prefix apps/circuit-ai/circuit-ai-frontend
          npm install --prefix "$HS_PLAYWRIGHT_ROOT" --no-save @playwright/test@1.55.0
          "$HS_PLAYWRIGHT_ROOT/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run isolated production UI against the actual API
        if: matrix.backend == 'real'
        run: bash scripts/verify_device_frontend.sh real
      - name: Run broader studio regression checks
        if: matrix.backend == 'mock'
        run: bash scripts/verify_device_frontend.sh mock device-assembly device-firmware device-application device-observations donor-lookup donor-device-handoff donor-capture evidence-
      - name: Preserve test reports, service logs and downloads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-browser-${{ matrix.backend }}
          include-hidden-files: true
          path: |
            .cache/hardware-splicer/frontend-verify-*/playwright-report.json
            .cache/hardware-splicer/frontend-verify-*/playwright-output
            .cache/hardware-splicer/frontend-verify-*/*.log
          if-no-files-found: warn
  firmware:
    name: Compile catalog diagnostic proposal (no upload)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated compiler and backend environments
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e '.[dev]'
          python -m venv .cache/firmware-tools
          .cache/firmware-tools/bin/python -m pip install platformio==6.1.18
      - name: Compile a freshly recomputed ESP32 OLED BME280 proposal
        run: .venv/bin/python scripts/verify_device_firmware.py --platformio .cache/firmware-tools/bin/pio
      - name: Preserve the source, compiler result, logs and binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-firmware-compile-only
          path: |
            .cache/hardware-splicer/device-firmware/device-firmware-*/COMPILE_RESULT.json
            .cache/hardware-splicer/device-firmware/device-firmware-*/compile.log
            .cache/hardware-splicer/device-firmware/device-firmware-*/device-diagnostic-proposal.zip
            .cache/hardware-splicer/device-firmware/device-firmware-*/compiled-diagnostic-proposal.zip
            .cache/hardware-splicer/device-firmware/device-firmware-*/project/.pio/build/diagnostic/firmware.*
          include-hidden-files: true
          if-no-files-found: warn
