name: Engineering Source Ingestion

on:
  workflow_dispatch:
  push:
    paths:
      - "src/hardware_splicer/engineering_source_ingestion.py"
      - "src/hardware_splicer/engineering_source_ingestion_api.py"
      - "src/hardware_splicer/project_engineering_plan_api.py"
      - "src/hardware_splicer/product_api.py"
      - "tests/test_engineering_source_ingestion.py"
      - "tests/test_project_engineering_plan_api.py"
      - "apps/circuit-ai/circuit-ai-frontend/app/engineering/layout.tsx"
      - "apps/circuit-ai/circuit-ai-frontend/app/engineering/sources/**"
      - "apps/circuit-ai/circuit-ai-frontend/app/engineering/project-preflight/**"
      - "apps/circuit-ai/circuit-ai-frontend/app/api/proxy/engineering/projects/**/sources/ingest/route.ts"
      - "apps/circuit-ai/circuit-ai-frontend/app/api/proxy/engineering/projects/**/snapshot/route.ts"
      - "apps/circuit-ai/circuit-ai-frontend/app/api/proxy/engineering/projects/**/plan/route.ts"
      - "apps/circuit-ai/circuit-ai-frontend/scripts/test-engineering-source-workspace.cjs"
      - "docs/ENGINEERING_SOURCE_INGESTION.md"
      - ".github/workflows/engineering-source-ingestion.yml"
  pull_request:
    paths:
      - "src/hardware_splicer/engineering_source_ingestion.py"
      - "src/hardware_splicer/engineering_source_ingestion_api.py"
      - "src/hardware_splicer/project_engineering_plan_api.py"
      - "src/hardware_splicer/product_api.py"
      - "tests/test_engineering_source_ingestion.py"
      - "tests/test_project_engineering_plan_api.py"
      - "apps/circuit-ai/circuit-ai-frontend/app/engineering/layout.tsx"
      - "apps/circuit-ai/circuit-ai-frontend/app/engineering/sources/**"
      - "apps/circuit-ai/circuit-ai-frontend/app/engineering/project-preflight/**"
      - "apps/circuit-ai/circuit-ai-frontend/app/api/proxy/engineering/projects/**/sources/ingest/route.ts"
      - "apps/circuit-ai/circuit-ai-frontend/app/api/proxy/engineering/projects/**/snapshot/route.ts"
      - "apps/circuit-ai/circuit-ai-frontend/app/api/proxy/engineering/projects/**/plan/route.ts"
      - "apps/circuit-ai/circuit-ai-frontend/scripts/test-engineering-source-workspace.cjs"
      - "docs/ENGINEERING_SOURCE_INGESTION.md"
      - ".github/workflows/engineering-source-ingestion.yml"

jobs:
  ingestion-contract:
    name: Project source and planning contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HARDWARE_SPLICER_SKIP_VISION_LIVE: "1"
      HARDWARE_SPLICER_OFFLINE_LLM: "1"
      HARDWARE_SPLICER_OFFLINE_VISION: "1"
      HARDWARE_SPLICER_OFFLINE_SALVAGE: "1"
      QWEN_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Hardware Splicer and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Compile project engineering modules
        run: |
          python -m py_compile \
            src/hardware_splicer/engineering_source_ingestion.py \
            src/hardware_splicer/engineering_source_ingestion_api.py \
            src/hardware_splicer/project_engineering_plan_api.py \
            src/hardware_splicer/product_api.py
      - name: Run project engineering tests
        run: |
          PYTHONPATH=src python -m pytest -q \
            tests/test_engineering_source_ingestion.py \
            tests/test_project_engineering_plan_api.py
      - uses: actions/setup-node@v4
        if: ${{ !cancelled() }}
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/circuit-ai/circuit-ai-frontend/package-lock.json
      - name: Install frontend dependencies
        if: ${{ !cancelled() }}
        working-directory: apps/circuit-ai/circuit-ai-frontend
        run: npm ci
      - name: Validate project engineering workspaces
        if: ${{ !cancelled() }}
        working-directory: apps/circuit-ai/circuit-ai-frontend
        run: |
          node scripts/test-engineering-source-workspace.cjs
          npm run typecheck
          npm run build
