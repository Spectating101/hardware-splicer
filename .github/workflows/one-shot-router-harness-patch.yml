name: One-shot router and fixture patch

on:
  push:
    branches:
      - agent/one-shot-router-harness-20260811

permissions:
  contents: write

jobs:
  apply-bounded-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore flat fixture harness and patch row escapes
        shell: bash
        run: |
          set -euo pipefail
          git show 13d35d09e960915d2dbdf6a20d8f1e30e0d1695c:scripts/run_golden_semiconductor_fixture_e2e.py > scripts/run_golden_semiconductor_fixture_e2e.py

          python - <<'PY'
          from pathlib import Path

          golden = Path('scripts/run_golden_semiconductor_fixture_e2e.py')
          text = golden.read_text(encoding='utf-8')
          needle = '"powered_off_high_impedance_required": true'
          assert text.count(needle) == 1, text.count(needle)
          text = text.replace(needle, '"powered_off_high_impedance_required": True', 1)
          golden.write_text(text, encoding='utf-8')

          py = Path('src/hardware_splicer/pcb/build_to_geometry.py')
          text = py.read_text(encoding='utf-8')
          start = text.index('        def route_bottom(side: list[dict]) -> None:')
          end = text.index('\n        route_side(right_pads, "right")', start)
          block = text[start:end]
          old_bounds = (
              '            m = len(routed)\n'
              '            ch_lo = pl["padMinX"] - PAD_SIZE / 2 - HALF + 0.6\n'
              '            ch_hi = pl["padMaxX"] + PAD_SIZE / 2 + HALF - 0.6\n\n'
          )
          old_escape = '                escape_x = ch_lo + ((idx2 + 1) * (ch_hi - ch_lo)) / (m + 1)'
          assert block.count(old_bounds) == 1, block.count(old_bounds)
          assert block.count(old_escape) == 1, block.count(old_escape)
          block = block.replace(old_bounds, '', 1)
          block = block.replace(old_escape, '                escape_x = p_pos["x"]', 1)
          text = text[:start] + block + text[end:]
          py.write_text(text, encoding='utf-8')

          ts = Path('apps/circuit-ai/circuit-ai-frontend/lib/pcb/build-to-geometry.ts')
          text = ts.read_text(encoding='utf-8')
          start = text.index('    const routeBottom = (side: Array<{ pid: string; x: number; y: number }>) => {')
          end = text.index('\n    routeSide(rightPads, "right");', start)
          block = text[start:end]
          old_bounds = (
              '      const m = routed.length;\n'
              '      const chLo = pl.padMinX - PAD_SIZE / 2 - HALF + 0.6;\n'
              '      const chHi = pl.padMaxX + PAD_SIZE / 2 + HALF - 0.6;\n'
          )
          old_escape = '        const escapeX = chLo + ((idx + 1) * (chHi - chLo)) / (m + 1);'
          assert block.count(old_bounds) == 1, block.count(old_bounds)
          assert block.count(old_escape) == 1, block.count(old_escape)
          block = block.replace(old_bounds, '', 1)
          block = block.replace(old_escape, '        const escapeX = p.x;', 1)
          text = text[:start] + block + text[end:]
          ts.write_text(text, encoding='utf-8')
          PY

      - name: Assert bounded result
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/run_golden_semiconductor_fixture_e2e.py src/hardware_splicer/pcb/build_to_geometry.py
          python - <<'PY'
          from pathlib import Path

          golden = Path('scripts/run_golden_semiconductor_fixture_e2e.py').read_text(encoding='utf-8')
          assert 'case["project"]' not in golden
          assert '"powered_off_high_impedance_required": True' in golden

          py = Path('src/hardware_splicer/pcb/build_to_geometry.py').read_text(encoding='utf-8')
          p0 = py.index('        def route_bottom(side: list[dict]) -> None:')
          p1 = py.index('\n        route_side(right_pads, "right")', p0)
          py_bottom = py[p0:p1]
          assert 'escape_x = p_pos["x"]' in py_bottom
          assert 'ch_lo + ((idx2 + 1)' not in py_bottom
          assert py.count('ch_lo + ((idx2 + 1)') == 1  # side routing remains unchanged

          ts = Path('apps/circuit-ai/circuit-ai-frontend/lib/pcb/build-to-geometry.ts').read_text(encoding='utf-8')
          t0 = ts.index('    const routeBottom = (side: Array<{ pid: string; x: number; y: number }>) => {')
          t1 = ts.index('\n    routeSide(rightPads, "right");', t0)
          ts_bottom = ts[t0:t1]
          assert 'const escapeX = p.x;' in ts_bottom
          assert 'chLo + ((idx + 1)' not in ts_bottom
          assert ts.count('chLo + ((idx + 1)') == 1  # side routing remains unchanged
          PY

      - name: Commit bounded patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-router-harness-patch.yml
          git config user.name 'hardware-splicer-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/run_golden_semiconductor_fixture_e2e.py \
                  src/hardware_splicer/pcb/build_to_geometry.py \
                  apps/circuit-ai/circuit-ai-frontend/lib/pcb/build-to-geometry.ts
          git commit -m 'Repair row-pad escapes and restore fixture harness'
          git push origin HEAD:${GITHUB_REF_NAME}
