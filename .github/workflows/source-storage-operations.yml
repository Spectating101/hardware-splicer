name: Source Storage Operations

on:
  workflow_dispatch:
  push:
    paths:
      - "src/hardware_splicer/source_storage_operations.py"
      - "src/hardware_splicer/source_storage_operations_api.py"
      - "src/hardware_splicer/product_api.py"
      - "tests/test_source_storage_operations.py"
      - "apps/circuit-ai/circuit-ai-frontend/app/engineering/storage-ops/**"
      - "apps/circuit-ai/circuit-ai-frontend/app/engineering/layout.tsx"
      - "apps/circuit-ai/circuit-ai-frontend/app/api/proxy/engineering/projects/**/source-storage/**"
      - "apps/circuit-ai/circuit-ai-frontend/scripts/test-source-storage-operations.cjs"
      - "docs/SOURCE_STORAGE_OPERATIONS.md"
      - ".github/workflows/source-storage-operations.yml"
  pull_request:
    paths:
      - "src/hardware_splicer/source_storage_operations.py"
      - "src/hardware_splicer/source_storage_operations_api.py"
      - "src/hardware_splicer/product_api.py"
      - "tests/test_source_storage_operations.py"
      - "apps/circuit-ai/circuit-ai-frontend/app/engineering/storage-ops/**"
      - "apps/circuit-ai/circuit-ai-frontend/app/engineering/layout.tsx"
      - "apps/circuit-ai/circuit-ai-frontend/app/api/proxy/engineering/projects/**/source-storage/**"
      - "apps/circuit-ai/circuit-ai-frontend/scripts/test-source-storage-operations.cjs"
      - "docs/SOURCE_STORAGE_OPERATIONS.md"
      - ".github/workflows/source-storage-operations.yml"

jobs:
  storage-contract:
    name: Project source storage operations contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HARDWARE_SPLICER_SKIP_VISION_LIVE: "1"
      HARDWARE_SPLICER_OFFLINE_LLM: "1"
      HARDWARE_SPLICER_OFFLINE_VISION: "1"
      HARDWARE_SPLICER_OFFLINE_SALVAGE: "1"
      QWEN_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Hardware Splicer and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Compile storage operation modules
        run: |
          python -m py_compile \
            src/hardware_splicer/source_storage_operations.py \
            src/hardware_splicer/source_storage_operations_api.py \
            src/hardware_splicer/product_api.py
      - name: Run storage, resumable and registry tests
        run: |
          PYTHONPATH=src python -m pytest -q \
            tests/test_source_storage_operations.py \
            tests/test_source_upload_sessions.py \
            tests/test_engineering_source_multipart.py
      - uses: actions/setup-node@v4
        if: ${{ !cancelled() }}
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/circuit-ai/circuit-ai-frontend/package-lock.json
      - name: Install frontend dependencies
        if: ${{ !cancelled() }}
        working-directory: apps/circuit-ai/circuit-ai-frontend
        run: npm ci
      - name: Validate Storage Ops and production frontend
        if: ${{ !cancelled() }}
        working-directory: apps/circuit-ai/circuit-ai-frontend
        run: |
          node scripts/test-source-storage-operations.cjs
          npm run typecheck
          npm run build
