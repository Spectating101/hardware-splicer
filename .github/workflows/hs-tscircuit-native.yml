name: HS tscircuit Native Electronics Smoke

on:
  push:
    branches:
      - experiment/hs-external-engine-orchestration-20261022
  pull_request:
    branches:
      - experiment/hs-spi-native-cam-review-20261022
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tscircuit-native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install HS and pinned tscircuit compiler
        run: |
          python -m pip install -e '.[dev]'
          npm install -g @tscircuit/cli@0.1.1377
          tsci version

      - name: Prepare isolated TSX project dependencies
        working-directory: examples/external_engines/tsci
        run: |
          npm init -y
          npm install --no-save react react-dom @tscircuit/core
          test -f index.tsx

      - name: Execute HS orchestration through native tsci build
        run: |
          set -euo pipefail
          python scripts/run_external_engine_plan.py \
            examples/external_engines/tsci_build.json \
            --workspace examples/external_engines \
            --out "$RUNNER_TEMP/hs-tsci-native" --execute --timeout 180

      - name: Inspect native Circuit JSON evidence and authority ceiling
        run: |
          python - "$RUNNER_TEMP/hs-tsci-native" <<'PY'
          import json,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          report=json.loads((root/"ENGINE_ORCHESTRATION_REPORT.json").read_text())
          assert report["completed"]==1 and report["blocked"]==0, report
          assert not report["fabrication_authorized"] and not report["power_on_authorized"]
          payload=pathlib.Path("examples/external_engines/tsci/dist/index/circuit.json")
          contents=json.loads(payload.read_text())
          assert isinstance(contents,list) and len(contents)>0
          print("Native tscircuit circuit-json records",len(contents))
          PY

      - name: Capture native evidence, circuit JSON and task report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hs-tscircuit-native-output
          path: |
            ${{ runner.temp }}/hs-tsci-native/
            examples/external_engines/tsci/dist/
          if-no-files-found: warn
