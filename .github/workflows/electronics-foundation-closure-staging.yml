name: Electronics Foundation Closure Staging

on:
  push:
    branches:
      - "agent/electronics-foundation-current-20260810"
    paths:
      - "src/hardware_splicer/discrete_capacitance_truth.py"
      - "experiments/electronics/discrete_uart_3v3_1v8_evidence.json"
      - "experiments/electronics/discrete_uart_3v3_1v8_gpt56_sol.json"
      - "tests/test_discrete_capacitance_truth.py"
      - "scripts/run_discrete_footprint_presence_probe.py"
      - ".github/workflows/electronics-foundation-closure-staging.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closure:
    name: Effective capacitance and exact KiCad footprint closure
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install HS and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Test effective-capacitance truth boundary
        run: pytest -q tests/test_discrete_capacitance_truth.py
      - name: Install current stable KiCad
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes --install-recommends kicad
          kicad-cli version
      - name: Verify exact footprint candidates in installed KiCad
        run: |
          python scripts/run_discrete_footprint_presence_probe.py \
            --evidence experiments/electronics/discrete_uart_3v3_1v8_evidence.json \
            --out-dir artifacts/electronics-foundation-closure \
            --kicad-footprint-root /usr/share/kicad/footprints
      - name: Upload closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electronics-foundation-closure-staging
          path: artifacts/electronics-foundation-closure
          if-no-files-found: warn
