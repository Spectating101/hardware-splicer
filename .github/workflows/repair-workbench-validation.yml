name: Repair Workbench Validation

on:
  push:
    branches:
      - feat/machine-workbench-v0-20260829
    paths:
      - .github/workflows/repair-workbench-validation.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/machine-workbench-v0-20260829
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair and syntax-check durability fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/circuit-ai/circuit-ai-frontend/e2e/machine-project-bound-brep-durability.spec.js')
          text = path.read_text()
          fixes = {
              "expect(body.expected_revision).toBe(Mainboard ? 4 : 8);": "expect(body.expected_revision).toBe(mainboard ? 4 : 8);",
              "await route.fulfill {": "await route.fulfill({",
          }
          for old, new in fixes.items():
              assert text.count(old) == 1, (old, text.count(old))
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          node --check apps/circuit-ai/circuit-ai-frontend/e2e/machine-project-bound-brep-durability.spec.js
          grep -F "expect(body.expected_revision).toBe(mainboard ? 4 : 8);" apps/circuit-ai/circuit-ai-frontend/e2e/machine-project-bound-brep-durability.spec.js
          grep -F "revision: mainboard ? 5 : 9" apps/circuit-ai/circuit-ai-frontend/e2e/machine-project-bound-brep-durability.spec.js
      - name: Commit repair
        run: |
          git config user.name 'hardware-splicer-validation-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/circuit-ai/circuit-ai-frontend/e2e/machine-project-bound-brep-durability.spec.js
          git diff --cached --check
          git commit -m 'Fix durability placement fixture syntax'
          git push origin HEAD:feat/machine-workbench-v0-20260829
