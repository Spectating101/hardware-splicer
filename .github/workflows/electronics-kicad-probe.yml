name: Electronics KiCad Probe

on:
  pull_request:
    paths:
      - "src/hardware_splicer/netlist/**"
      - "src/hardware_splicer/pcb/**"
      - "src/hardware_splicer/integrations/schematic_export.py"
      - "src/hardware_splicer/integrations/schematic_symbols.py"
      - "src/hardware_splicer/electronics_foundation_benchmark.py"
      - "experiments/electronics/esp32_hcsr04_level_shift_gpt56_sol.json"
      - "scripts/run_electronics_kicad_probe.py"
      - ".github/workflows/electronics-kicad-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: electronics-kicad-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  kicad-probe:
    name: Real KiCad schematic and PCB probes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HARDWARE_SPLICER_OFFLINE_SALVAGE: "0"
      HARDWARE_SPLICER_OFFLINE_SEMANTIC_REWRITE: "0"
      HARDWARE_SPLICER_DRC_FIX_LOOP: "0"
      HARDWARE_SPLICER_AUTOROUTE: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Hardware Splicer
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Install current stable KiCad
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes --install-recommends kicad
          kicad-cli version

      - name: Recheck electrical truth before lowering
        run: pytest -q tests/test_electronics_foundation_benchmark.py

      - name: Run real KiCad lowering probe
        run: |
          python scripts/run_electronics_kicad_probe.py \
            --proposal-bundle experiments/electronics/esp32_hcsr04_level_shift_gpt56_sol.json \
            --out-dir artifacts/electronics-kicad-probe

      - name: Upload KiCad probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electronics-kicad-probe
          path: artifacts/electronics-kicad-probe
          if-no-files-found: warn
