name: Outsider JARVIS Browser E2E

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/mock_outsider_jarvis_backend.py"
      - "apps/circuit-ai/circuit-ai-frontend/e2e/outsider-jarvis-workflow.spec.js"
      - "apps/circuit-ai/circuit-ai-frontend/app/engineering/ai-studio/**"
      - "apps/circuit-ai/circuit-ai-frontend/app/engineering/jarvis/**"
      - "apps/circuit-ai/circuit-ai-frontend/app/engineering/packages/**"
      - "apps/circuit-ai/circuit-ai-frontend/app/api/proxy/engineering/projects/**"
      - "apps/circuit-ai/circuit-ai-frontend/app/api/proxy/_backend.ts"
      - "apps/circuit-ai/circuit-ai-frontend/package.json"
      - "apps/circuit-ai/circuit-ai-frontend/package-lock.json"
      - "docs/OUTSIDER_JARVIS_BROWSER_E2E.md"
      - ".github/workflows/outsider-jarvis-browser-e2e.yml"
  pull_request:
    paths:
      - "scripts/mock_outsider_jarvis_backend.py"
      - "apps/circuit-ai/circuit-ai-frontend/e2e/outsider-jarvis-workflow.spec.js"
      - "apps/circuit-ai/circuit-ai-frontend/app/engineering/ai-studio/**"
      - "apps/circuit-ai/circuit-ai-frontend/app/engineering/jarvis/**"
      - "apps/circuit-ai/circuit-ai-frontend/app/engineering/packages/**"
      - "apps/circuit-ai/circuit-ai-frontend/app/api/proxy/engineering/projects/**"
      - "apps/circuit-ai/circuit-ai-frontend/app/api/proxy/_backend.ts"
      - "apps/circuit-ai/circuit-ai-frontend/package.json"
      - "apps/circuit-ai/circuit-ai-frontend/package-lock.json"
      - "docs/OUTSIDER_JARVIS_BROWSER_E2E.md"
      - ".github/workflows/outsider-jarvis-browser-e2e.yml"

jobs:
  outsider-browser:
    name: Grounded question to verified package download
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HARDWARE_SPLICER_API_URL: http://127.0.0.1:8090
      OUTSIDER_APP_URL: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: "1"
      HARDWARE_SPLICER_SKIP_VISION_LIVE: "1"
      HARDWARE_SPLICER_OFFLINE_LLM: "1"
      HARDWARE_SPLICER_OFFLINE_VISION: "1"
      HARDWARE_SPLICER_OFFLINE_SALVAGE: "1"
      QWEN_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install mock backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m py_compile scripts/mock_outsider_jarvis_backend.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/circuit-ai/circuit-ai-frontend/package-lock.json
      - name: Install locked frontend and isolated browser harness
        working-directory: apps/circuit-ai/circuit-ai-frontend
        run: |
          npm ci
          rm -rf /tmp/hs-playwright
          npm install --prefix /tmp/hs-playwright --no-save @playwright/test@1.55.0
          /tmp/hs-playwright/node_modules/.bin/playwright install --with-deps chromium
          mkdir -p node_modules/@playwright
          ln -s /tmp/hs-playwright/node_modules/@playwright/test node_modules/@playwright/test
          ln -s /tmp/hs-playwright/node_modules/playwright node_modules/playwright
          ln -s /tmp/hs-playwright/node_modules/playwright-core node_modules/playwright-core
      - name: Build production frontend
        working-directory: apps/circuit-ai/circuit-ai-frontend
        run: |
          npm run typecheck
          npm run build
      - name: Run outsider browser path
        run: |
          set -euo pipefail
          python scripts/mock_outsider_jarvis_backend.py > /tmp/outsider-backend.log 2>&1 &
          BACKEND_PID=$!
          pushd apps/circuit-ai/circuit-ai-frontend >/dev/null
          npm run start -- -H 127.0.0.1 -p 3000 > /tmp/outsider-frontend.log 2>&1 &
          FRONTEND_PID=$!
          popd >/dev/null
          cleanup() {
            kill "$FRONTEND_PID" "$BACKEND_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8090/healthz >/dev/null \
              && curl --fail --silent http://127.0.0.1:3000/engineering/jarvis >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "mock backend log"
              cat /tmp/outsider-backend.log || true
              echo "frontend log"
              cat /tmp/outsider-frontend.log || true
              exit 1
            fi
            sleep 2
          done
          pushd apps/circuit-ai/circuit-ai-frontend >/dev/null
          /tmp/hs-playwright/node_modules/.bin/playwright test e2e/outsider-jarvis-workflow.spec.js \
            --browser=chromium \
            --reporter=line \
            --trace=retain-on-failure
          popd >/dev/null
      - name: Show service logs on failure
        if: failure()
        run: |
          echo "mock backend log"
          cat /tmp/outsider-backend.log || true
          echo "frontend log"
          cat /tmp/outsider-frontend.log || true
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outsider-jarvis-browser-e2e
          path: |
            apps/circuit-ai/circuit-ai-frontend/test-results
            /tmp/outsider-backend.log
            /tmp/outsider-frontend.log
          if-no-files-found: warn
