name: Discrete Footprint Presence Staging

on:
  push:
    branches:
      - "agent/discrete-footprint-staging-20260810"
    paths:
      - "experiments/electronics/discrete_uart_3v3_1v8_evidence.json"
      - "scripts/run_discrete_footprint_presence_probe.py"
      - ".github/workflows/discrete-footprint-presence-staging.yml"
  pull_request:
    paths:
      - "experiments/electronics/discrete_uart_3v3_1v8_evidence.json"
      - "scripts/run_discrete_footprint_presence_probe.py"
      - ".github/workflows/discrete-footprint-presence-staging.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  footprint-presence:
    name: Manufacturer package candidates exist in KiCad
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install current stable KiCad
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes --install-recommends kicad
          kicad-cli version

      - name: Verify footprint candidates against installed library
        run: |
          python scripts/run_discrete_footprint_presence_probe.py \
            --evidence experiments/electronics/discrete_uart_3v3_1v8_evidence.json \
            --out-dir artifacts/discrete-footprint-presence \
            --kicad-footprint-root /usr/share/kicad/footprints

      - name: Upload footprint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discrete-footprint-presence-staging
          path: artifacts/discrete-footprint-presence
          if-no-files-found: warn
