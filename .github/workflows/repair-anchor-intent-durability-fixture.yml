name: Repair Anchor Intent Durability Fixture

on:
  push:
    branches:
      - feat/workbench-anchor-intent-persistence-v0
    paths:
      - .github/workflows/repair-anchor-intent-durability-fixture.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/workbench-anchor-intent-persistence-v0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Upgrade durable BREP fixture to anchor-intent ledger
        run: |
          git fetch origin b59ea22409294410c1ac386d01dc1bebb3fd37b2 --depth=1
          git show FETCH_HEAD:apps/circuit-ai/circuit-ai-frontend/e2e/machine-project-bound-brep-durability.spec.js > apps/circuit-ai/circuit-ai-frontend/e2e/machine-project-bound-brep-durability.spec.js
          printf '%s' '' | base64 -d > /tmp/repair_fixture.py
          python /tmp/repair_fixture.py
          node --check apps/circuit-ai/circuit-ai-frontend/e2e/machine-project-bound-brep-durability.spec.js
      - name: Preserve validated readability floor
        run: |
          python -c "from pathlib import Path; p=Path('apps/circuit-ai/circuit-ai-frontend/components/workbench/constructor-dock.tsx'); t=p.read_text(); old='px-1.5 py-0.5 text-[7px] font-semibold uppercase tracking-[0.1em]'; t=t.replace(old,'px-1.5 py-0.5 text-[8px] font-semibold uppercase tracking-[0.1em]',1); p.write_text(t); assert 'text-[7px]' not in p.read_text()"
      - name: Commit fixture upgrade
        run: |
          git config user.name 'hardware-splicer-validation-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/circuit-ai/circuit-ai-frontend/e2e/machine-project-bound-brep-durability.spec.js apps/circuit-ai/circuit-ai-frontend/components/workbench/constructor-dock.tsx
          git diff --cached --check
          git commit -m 'Upgrade durable BREP fixture for anchor intents'
          git push origin HEAD:feat/workbench-anchor-intent-persistence-v0
