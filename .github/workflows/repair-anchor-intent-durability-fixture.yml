name: Repair Anchor Intent Durability Fixture

on:
  push:
    branches:
      - feat/workbench-anchor-intent-persistence-v0
    paths:
      - .github/workflows/repair-anchor-intent-durability-fixture.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/workbench-anchor-intent-persistence-v0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Upgrade durable BREP fixture to anchor-intent ledger
        run: |
          git fetch origin b59ea22409294410c1ac386d01dc1bebb3fd37b2 --depth=1
          git show FETCH_HEAD:apps/circuit-ai/circuit-ai-frontend/e2e/machine-project-bound-brep-durability.spec.js > apps/circuit-ai/circuit-ai-frontend/e2e/machine-project-bound-brep-durability.spec.js
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/circuit-ai/circuit-ai-frontend/e2e/machine-project-bound-brep-durability.spec.js')
          text = p.read_text()

          replacements = {
            "  const placementPersistenceRequests = [];\n": "  const placementPersistenceRequests = [];\n  const anchorIntentRequests = [];\n",
            "    const expectedRevision = mainboard ? 1 : 5;": "    const expectedRevision = mainboard ? 1 : 6;",
            "        revision: mainboard ? 2 : 6,": "        revision: mainboard ? 2 : 7,",
            "    expect(body.expected_revision).toBe(mainboard ? 2 : 6);": "    expect(body.expected_revision).toBe(mainboard ? 2 : 7);",
            "      body: JSON.stringify(parserResponse(sourceId, mainboard ? 3 : 7)),": "      body: JSON.stringify(parserResponse(sourceId, mainboard ? 3 : 8)),",
            "    expect(body.expected_revision).toBe(mainboard ? 3 : 7);": "    expect(body.expected_revision).toBe(mainboard ? 3 : 8);",
            "        revision: mainboard ? 4 : 8,": "        revision: mainboard ? 4 : 9,",
            "    expect(body.expected_revision).toBe(mainboard ? 4 : 8);": "    expect(body.expected_revision).toBe(mainboard ? 4 : 9);",
            "        revision: mainboard ? 5 : 9,": "        revision: mainboard ? 5 : 10,",
            "  await expect(page.getByTestId('workbench-project-provenance')).toContainText(`Project ${PROJECT_ID} · revision 8 · 2 registered sources · 2 workbench bindings`);": "  await expect(page.getByTestId('workbench-project-provenance')).toContainText(`Project ${PROJECT_ID} · revision 9 · 2 registered sources · 2 workbench bindings`);",
            "  expect(placementPersistenceRequests).toHaveLength(2);": "  expect(placementPersistenceRequests).toHaveLength(2);\n  expect(anchorIntentRequests).toHaveLength(2);\n  expect(anchorIntentRequests.every((body) => !Object.prototype.hasOwnProperty.call(body, 'face_index'))).toBe(true);\n  expect(anchorIntentRequests.every((body) => !Object.prototype.hasOwnProperty.call(body, 'anchor_point_mm'))).toBe(true);\n  expect(anchorIntentRequests.every((body) => !Object.prototype.hasOwnProperty.call(body, 'outward_normal'))).toBe(true);",
          }
          for old, new in replacements.items():
              assert text.count(old) == 1, (old, text.count(old))
              text = text.replace(old, new, 1)

          marker = "  await page.route('**/api/proxy/engineering/mechanical/geometry/place', async (route) => {\n"
          assert text.count(marker) == 1
          route_block = r'''  await page.route(`**/api/proxy/engineering/projects/${PROJECT_ID}/workbench/anchor-intents`, async (route) => {
    const body = JSON.parse(route.request().postData() || '{}');
    anchorIntentRequests.push(body);
    const mainboard = body.resource_id === 'res-mainboard-donor';
    expect(body.expected_revision).toBe(mainboard ? 5 : 10);
    expect(body.candidate_id).toBe('balanced');
    expect(body.entity_id).toBe(mainboard ? 'cmp-mainboard' : 'cmp-display');
    expect(body.interface_id).toBe('if-display');
    expect(body.anchor_id).toBe(mainboard ? 'anchor-balanced-cmp-mainboard-if-display' : 'anchor-balanced-cmp-display-if-display');
    expect(body.source_id).toBe(mainboard ? MAINBOARD_SOURCE : DISPLAY_SOURCE);
    expect(body.model_id).toBe(body.source_id);
    expect(body.content_hash).toBe(mainboard ? HASH_A : HASH_B);
    expect(body.placement_id).toBe(mainboard ? 'placement-balanced-res-mainboard-donor' : 'placement-balanced-res-display-controlled');
    expect(body.target_frame).toBe('assembly');
    expect(body.translation_mm).toEqual(mainboard ? [0, 0, 0] : [150, 0, 0]);
    expect(body.rotation_deg_xyz).toEqual([0, 0, 0]);
    expect(body.max_snap_distance_mm).toBe(5);
    expect(body.authority).toBe('declared');
    expect(body).not.toHaveProperty('face_index');
    expect(body).not.toHaveProperty('anchor_point_mm');
    expect(body).not.toHaveProperty('outward_normal');
    const intent = {
      schema_version: 'hardware_splicer.workbench_brep_anchor_intent.v1',
      candidate_id: body.candidate_id,
      resource_id: body.resource_id,
      entity_id: body.entity_id,
      interface_id: body.interface_id,
      anchor_id: body.anchor_id,
      source_id: body.source_id,
      model_id: body.model_id,
      content_hash: body.content_hash,
      placement_id: body.placement_id,
      target_frame: body.target_frame,
      translation_mm: body.translation_mm,
      rotation_deg_xyz: body.rotation_deg_xyz,
      probe_point_mm: body.probe_point_mm,
      max_snap_distance_mm: body.max_snap_distance_mm,
      authority: 'declared',
      source_binding_required: true,
      durable_placement_required: true,
      registered_source_hash_reverified: true,
      kernel_result_persisted: false,
      face_identity_persisted: false,
      anchor_point_persisted: false,
      surface_normal_persisted: false,
      requires_occt_resnap_on_reopen: true,
      physical_authority_unchanged: true,
      connector_mating_verified: false,
      physical_measurement: false,
      automatic_authorization: false,
      fabrication_authorized: false,
      power_on_authorized: false,
      motion_authorized: false,
      release_authorized: false,
    };
    await route.fulfill({
      status: 201,
      contentType: 'application/json',
      body: JSON.stringify({
        ok: true,
        registered: true,
        project_id: PROJECT_ID,
        revision: mainboard ? 6 : 11,
        workbench_anchor_intent: intent,
        registered_source_hash_reverified: true,
        kernel_result_persisted: false,
        physical_authority_unchanged: true,
      }),
    });
  });

'''
          text = text.replace(marker, route_block + marker, 1)
          p.write_text(text)
          PY
          node --check apps/circuit-ai/circuit-ai-frontend/e2e/machine-project-bound-brep-durability.spec.js
      - name: Preserve validated readability floor
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/circuit-ai/circuit-ai-frontend/components/workbench/constructor-dock.tsx')
          text = p.read_text()
          old = "px-1.5 py-0.5 text-[7px] font-semibold uppercase tracking-[0.1em]"
          if old in text:
              text = text.replace(old, "px-1.5 py-0.5 text-[8px] font-semibold uppercase tracking-[0.1em]", 1)
              p.write_text(text)
          assert 'text-[7px]' not in p.read_text()
          PY
      - name: Commit fixture upgrade
        run: |
          git config user.name 'hardware-splicer-validation-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/circuit-ai/circuit-ai-frontend/e2e/machine-project-bound-brep-durability.spec.js \
                  apps/circuit-ai/circuit-ai-frontend/components/workbench/constructor-dock.tsx
          git diff --cached --check
          git commit -m 'Upgrade durable BREP fixture for anchor intents'
          git push origin HEAD:feat/workbench-anchor-intent-persistence-v0
