name: Resumable Source Uploads

on:
  workflow_dispatch:
  push:
    paths:
      - "src/hardware_splicer/source_upload_session.py"
      - "src/hardware_splicer/source_upload_session_api.py"
      - "src/hardware_splicer/product_api.py"
      - "tests/test_source_upload_sessions.py"
      - "apps/circuit-ai/circuit-ai-frontend/app/engineering/resumable-uploads/**"
      - "apps/circuit-ai/circuit-ai-frontend/app/engineering/layout.tsx"
      - "apps/circuit-ai/circuit-ai-frontend/app/api/proxy/engineering/projects/**/source-upload-sessions/**"
      - "apps/circuit-ai/circuit-ai-frontend/scripts/test-resumable-source-uploads.cjs"
      - "docs/RESUMABLE_SOURCE_UPLOADS.md"
      - ".github/workflows/resumable-source-uploads.yml"
  pull_request:
    paths:
      - "src/hardware_splicer/source_upload_session.py"
      - "src/hardware_splicer/source_upload_session_api.py"
      - "src/hardware_splicer/product_api.py"
      - "tests/test_source_upload_sessions.py"
      - "apps/circuit-ai/circuit-ai-frontend/app/engineering/resumable-uploads/**"
      - "apps/circuit-ai/circuit-ai-frontend/app/engineering/layout.tsx"
      - "apps/circuit-ai/circuit-ai-frontend/app/api/proxy/engineering/projects/**/source-upload-sessions/**"
      - "apps/circuit-ai/circuit-ai-frontend/scripts/test-resumable-source-uploads.cjs"
      - "docs/RESUMABLE_SOURCE_UPLOADS.md"
      - ".github/workflows/resumable-source-uploads.yml"

jobs:
  resumable-contract:
    name: Resumable source upload contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HARDWARE_SPLICER_SKIP_VISION_LIVE: "1"
      HARDWARE_SPLICER_OFFLINE_LLM: "1"
      HARDWARE_SPLICER_OFFLINE_VISION: "1"
      HARDWARE_SPLICER_OFFLINE_SALVAGE: "1"
      QWEN_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Hardware Splicer and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Compile upload-session modules
        run: |
          python -m py_compile \
            src/hardware_splicer/source_upload_session.py \
            src/hardware_splicer/source_upload_session_api.py \
            src/hardware_splicer/product_api.py
      - name: Run resumable and transport tests
        run: |
          PYTHONPATH=src python -m pytest -q \
            tests/test_source_upload_sessions.py \
            tests/test_engineering_source_multipart.py \
            tests/test_engineering_source_ingestion.py
      - uses: actions/setup-node@v4
        if: ${{ !cancelled() }}
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/circuit-ai/circuit-ai-frontend/package-lock.json
      - name: Install frontend dependencies
        if: ${{ !cancelled() }}
        working-directory: apps/circuit-ai/circuit-ai-frontend
        run: npm ci
      - name: Validate resumable workspace and production frontend
        if: ${{ !cancelled() }}
        working-directory: apps/circuit-ai/circuit-ai-frontend
        run: |
          node scripts/test-resumable-source-uploads.cjs
          npm run typecheck
          npm run build
