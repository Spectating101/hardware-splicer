name: HS Public Commercial Signals - Read Only

on:
  workflow_dispatch:
  schedule:
    # Runs only after merged to default branch; live public-source signals remain artifacts.
    - cron: '21 3 * * 1'
  pull_request:
    paths:
      - '.github/workflows/hs-public-market-signal-refresh.yml'
      - 'src/hardware_splicer/market_signal_acquisition.py'
      - 'scripts/hs_market_signal_refresh.py'
      - 'scripts/hs_market_evidence_handoff.py'
      - 'examples/cyberdeck/dual_touch/market/discovery_plan.json'
      - 'tests/test_market_signal_acquisition.py'

permissions:
  contents: read

jobs:
  validate-acquisition-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HS/test requirements
        run: python -m pip install --disable-pip-version-check -e . 'pytest>=8,<10'
      - name: Fail-closed offline signal-acquisition test suite
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q tests/test_market_signal_acquisition.py tests/test_commercial_evidence_bridge.py
          python scripts/hs_market_signal_refresh.py --plan-only
          python scripts/hs_market_evidence_handoff.py --check-only

  acquire-public-sources:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: validate-acquisition-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HS backend
        run: python -m pip install --disable-pip-version-check -e .
      - name: Acquire bounded GitHub issues and Ruten asking-price observations
        env:
          PYTHONPATH: src
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/hs_market_signal_refresh.py
      - name: Reevaluate same HS release gates with fresh observations
        env:
          PYTHONPATH: src
        run: |
          python scripts/hs_market_evidence_handoff.py \
            --signals examples/cyberdeck/dual_touch/market/evidence/live_market_signals.json \
            --out examples/cyberdeck/dual_touch/market/evidence/live_commercial_handoff.json
      - name: Publish research-only artifacts without committing unreviewed data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HS-Public-Market-Signal-Snapshot-NO-COMMERCIAL-AUTHORITY
          path: |
            examples/cyberdeck/dual_touch/market/evidence/live_market_signals.json
            examples/cyberdeck/dual_touch/market/evidence/live_commercial_handoff.json
          if-no-files-found: warn
          retention-days: 30
