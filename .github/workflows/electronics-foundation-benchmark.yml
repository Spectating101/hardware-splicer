name: Electronics Foundation Benchmark

on:
  pull_request:
    paths:
      - "src/hardware_splicer/electronics_foundation_benchmark.py"
      - "src/hardware_splicer/netlist/erc.py"
      - "src/hardware_splicer/netlist/ir.py"
      - "src/hardware_splicer/pcb/module_registry.py"
      - "src/hardware_splicer/data/engine_pcb_data.json"
      - "experiments/electronics/esp32_hcsr04_level_shift_gpt56_sol.json"
      - "tests/test_electronics_foundation_benchmark.py"
      - "scripts/run_electronics_foundation_benchmark.py"
      - ".github/workflows/electronics-foundation-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: electronics-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  electrical-truth:
    name: Logic-domain truth and ERC sentinel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HARDWARE_SPLICER_OFFLINE_SALVAGE: "0"
      HARDWARE_SPLICER_OFFLINE_SEMANTIC_REWRITE: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run electronics truth tests
        run: pytest -q tests/test_electronics_foundation_benchmark.py

      - name: Persist electronics truth report
        run: |
          python scripts/run_electronics_foundation_benchmark.py \
            --proposal-bundle experiments/electronics/esp32_hcsr04_level_shift_gpt56_sol.json \
            --out-dir artifacts/electronics-foundation

      - name: Upload electronics evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electronics-foundation-benchmark
          path: artifacts/electronics-foundation
          if-no-files-found: error
