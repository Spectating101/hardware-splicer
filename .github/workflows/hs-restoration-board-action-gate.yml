name: HS source-to-physical board authority gate
on:
  pull_request:
    paths:
      - 'src/hardware_splicer/restoration_board_action_gate.py'
      - 'src/hardware_splicer/restoration_board_action_correction.py'
      - 'src/hardware_splicer/restoration_reasoning_agent.py'
      - 'examples/restoration_video_bench/real_schematic/**'
      - 'tests/test_restoration_board_action_gate.py'
      - 'tests/test_restoration_board_action_gate_live.py'
      - '.github/workflows/hs-restoration-board-action-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fail-closed-revision-and-source-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . 'pytest>=8,<10'
      - name: Verify source pins remain separate from physical authority
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q \
            tests/test_restoration_board_action_gate.py \
            tests/test_restoration_board_action_gate_live.py \
            tests/test_restoration_real_schematic.py \
            tests/test_restoration_real_schematic_live.py \
            tests/test_restoration_numeric_truth_gate.py \
            tests/test_restoration_reasoning_agent.py
      - name: No model call in CI
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('examples/restoration_video_bench/real_schematic/dmg_board_gate_correction_live.json')
          if p.exists():
              r=json.loads(p.read_text())
              assert r['one_correction_attempt_only'] is True
              assert r['source_evidence_unchanged'] is True
              assert r['target_board_physically_verified'] is False
              assert r['physical_test_or_repair_authorized'] is False
              assert r['correction']['repair_authorized'] is False
          PY
