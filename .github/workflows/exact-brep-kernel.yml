name: Exact BREP Kernel

on:
  pull_request:
    paths:
      - "src/hardware_splicer/mechanical_brep.py"
      - "src/hardware_splicer/_cadquery_brep_worker.py"
      - "src/hardware_splicer/mechanical_brep_mesh.py"
      - "src/hardware_splicer/_cadquery_brep_mesh_worker.py"
      - "src/hardware_splicer/mechanical_brep_mesh_api.py"
      - "src/hardware_splicer/mechanical_brep_anchor.py"
      - "src/hardware_splicer/_cadquery_brep_anchor_worker.py"
      - "src/hardware_splicer/mechanical_brep_anchor_api.py"
      - "src/hardware_splicer/mechanical_brep_mating.py"
      - "src/hardware_splicer/mechanical_brep_mating_api.py"
      - "src/hardware_splicer/mechanical_brep_sweep.py"
      - "src/hardware_splicer/_cadquery_brep_sweep_worker.py"
      - "src/hardware_splicer/mechanical_brep_sweep_api.py"
      - "src/hardware_splicer/mechanical_placement.py"
      - "src/hardware_splicer/step_geometry.py"
      - "src/hardware_splicer/mechanical_api.py"
      - "src/hardware_splicer/product_api.py"
      - "tests/test_mechanical_brep.py"
      - "tests/test_mechanical_brep_api.py"
      - "tests/test_mechanical_brep_hash_binding.py"
      - "tests/test_mechanical_brep_live_api.py"
      - "tests/test_mechanical_brep_mesh.py"
      - "tests/test_mechanical_brep_mesh_api.py"
      - "tests/test_mechanical_brep_anchor.py"
      - "tests/test_mechanical_brep_anchor_api.py"
      - "tests/test_mechanical_brep_mating.py"
      - "tests/test_mechanical_brep_mating_api.py"
      - "tests/test_mechanical_brep_sweep.py"
      - "tests/test_mechanical_brep_sweep_api.py"
      - "pyproject.toml"
      - ".github/workflows/exact-brep-kernel.yml"

jobs:
  cadquery-occt:
    name: CadQuery OCCT pair interference, render mesh, anchors, mating, and sampled mating path
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install HS with isolated BREP specialist
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,brep]'
      - name: Prove specialist identity
        run: |
          python - <<'PY'
          import cadquery as cq
          assert cq.__version__ == "2.8.0", cq.__version__
          print(f"CadQuery {cq.__version__} / OCCT specialist import OK")
          PY
      - name: Run exact BREP contracts, real solid API proof, tessellation, anchors, mating geometry, and sampled path
        env:
          HARDWARE_SPLICER_SKIP_VISION_LIVE: "1"
        run: |
          PYTHONPATH=src python -m pytest -q --tb=short --maxfail=1 \
            tests/test_mechanical_brep.py \
            tests/test_mechanical_brep_api.py \
            tests/test_mechanical_brep_hash_binding.py \
            tests/test_mechanical_brep_live_api.py \
            tests/test_mechanical_brep_mesh.py \
            tests/test_mechanical_brep_mesh_api.py \
            tests/test_mechanical_brep_anchor.py \
            tests/test_mechanical_brep_anchor_api.py \
            tests/test_mechanical_brep_mating.py \
            tests/test_mechanical_brep_mating_api.py \
            tests/test_mechanical_brep_sweep.py \
            tests/test_mechanical_brep_sweep_api.py
