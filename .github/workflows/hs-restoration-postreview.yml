name: HS restoration postfreeze specificity score
on:
  pull_request:
    paths:
      - '.github/workflows/hs-restoration-postreview.yml'
      - 'examples/restoration_video_bench/diversity/postreview/**'
      - 'tests/test_restoration_diversity_postreview.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-postfreeze-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . 'pytest>=8,<10'
      - name: Score only AFTER exact pre-outcome SHA check
        run: |
          python examples/restoration_video_bench/diversity/postreview/score_faults.py
          git diff --exit-code -- examples/restoration_video_bench/diversity/postreview/score.json
      - name: Verify no inflated hits, provenance and tamper checks
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_restoration_diversity_postreview.py
