name: SPI Reference — Pinned KiCad Docker Verification

on:
  push:
    branches:
      - experiment/hs-spi-native-cam-review-20261022
  pull_request:
    branches:
      - experiment/hs-spi-reference-handoff-20261022
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-kicad:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install independent ZIP auditor
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_spi_native_cam_review.py

      - name: Pull official version-specific KiCad 9.0.9 image
        run: |
          docker pull ghcr.io/kicad/kicad:9.0.9-full

      - name: Rerun native KiCad 9.0.9, generate review CAM twice and compare
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/spi-container-evidence"
          docker run --rm --user 0:0 \
            -e HOME=/tmp \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$RUNNER_TEMP/spi-container-evidence:/out" \
            -w /workspace \
            ghcr.io/kicad/kicad:9.0.9-full /bin/sh -ec '
              kicad-cli --version | tee /out/KICAD_VERSION.txt
              kicad-cli --version | grep -E "^9\\.0\\.9$"
              /usr/bin/python3 -c "import pcbnew; print(pcbnew.Version()); assert pcbnew.Version().startswith(\"9.0.9\")"
              mkdir -p /out/native-reports
              /usr/bin/python3 hardware/reference_designs/spi_flash_adapter_v1/verify_design.py --report-dir /out/native-reports > /out/VERIFICATION_RECEIPT.json
              /usr/bin/python3 hardware/reference_designs/spi_flash_adapter_v1/build_package.py --output /out/spi-reference-native.zip
              /usr/bin/python3 hardware/reference_designs/spi_flash_adapter_v1/build_package.py --output /out/spi-reference-native-repeat.zip
              cmp /out/spi-reference-native.zip /out/spi-reference-native-repeat.zip
              sha256sum /out/spi-reference-native.zip > /out/REVIEW_ARCHIVE_SHA256.txt
            '

      - name: Audit native Gerbers and historical-vs-current source truth
        run: |
          python scripts/audit_spi_native_cam.py \
            "$RUNNER_TEMP/spi-container-evidence/spi-reference-native.zip" \
            --out "$RUNNER_TEMP/spi-container-evidence/NATIVE_CAM_AUDIT.json"
          python scripts/audit_spi_reference.py \
            --out "$RUNNER_TEMP/spi-container-evidence/source-audit"

      - name: Preserve KiCad 9.0.9 source-bound review evidence, not fabrication authority
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spi-pinned-kiCad9-review
          path: ${{ runner.temp }}/spi-container-evidence/
          if-no-files-found: warn
