name: HS Public Restoration Source-Blinded Original CircuitAI Replay
on:
  pull_request:
    paths:
      - ".github/workflows/public-restoration-blinded-replay.yml"
      - "examples/public_restoration_replays/**"
      - "scripts/bench_hs_public_restoration_blinded_001.py"
      - "scripts/verify_hs_public_restoration_blinded_001.py"
      - "apps/circuit-ai/src/intelligence/repair_case_evaluator.py"
      - "apps/circuit-ai/src/intelligence/repair_encyclopedia.py"
      - "apps/circuit-ai/src/intelligence/repair_video_playbook.py"
  workflow_dispatch:
jobs:
  real-original-circuitai-blinded-case-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight engine and source case dependencies
        run: |
          python -m pip install --no-input -e . "numpy>=1.26,<3" "networkx>=3,<4"
      - name: Run EIGHT genuinely outcome-blinded public-source scenarios through EXISTING Circuit-AI engine
        run: |
          python -m scripts.bench_hs_public_restoration_blinded_001 \
            --root . \
            --cases examples/public_restoration_replays/cases_2026_11_03.json \
            --out .cache/hs-public-restoration-blinded-replay
      - name: Independently verify no future repair leaked or physical success invented
        run: |
          python -m scripts.verify_hs_public_restoration_blinded_001 \
            --cases examples/public_restoration_replays/cases_2026_11_03.json \
            --report .cache/hs-public-restoration-blinded-replay/PUBLIC_RESTORATION_BLINDED_REPLAY.json \
            --output .cache/hs-public-restoration-blinded-replay/INDEPENDENT_PUBLIC_REPAIR_ACCEPTANCE.json
      - name: Adversarial future-gold leakage and false hardware evidence must fail
        run: |
          python - <<'PY'
          import json,tempfile
          from pathlib import Path
          from scripts.verify_hs_public_restoration_blinded_001 import verify
          original=Path("examples/public_restoration_replays/cases_2026_11_03.json")
          output=Path(".cache/hs-public-restoration-blinded-replay/PUBLIC_RESTORATION_BLINDED_REPLAY.json")
          base=json.loads(output.read_text())
          source=json.loads(original.read_text())
          tamper=[
            ("invented_device_repair",lambda j:j.update({"HS_actual_physical_repair_count":1})),
            ("invented_repair_verdict",lambda j:j["blinded_engine_predictions"][0]["original_engine_output"].update({"verdict":"physical_repaired"})),
            ("future_solution_in_input",lambda j:j["blinded_engine_predictions"][0]["blinded_engine_input"].update({"notes":"We already know cleaned contacts fixed the device"})),
            ("claim_video_frames_seen",lambda j:j.update({"source_video_frames_or_transcripts_reviewed":True})),
            ("switch_claimed_hardware_verified",lambda j:j["withheld_oracle_revealed_after_engine_predictions"][-1].update({"HS_completed_real_hardware_restoration":True})),
          ]
          with tempfile.TemporaryDirectory() as tmp:
            for name,change in tamper:
              v=json.loads(json.dumps(base))
              change(v)
              p=Path(tmp)/(name+".json");p.write_text(json.dumps(v))
              try:verify(original,p)
              except ValueError:pass
              else:raise AssertionError("future oracle or synthetic physical repair accepted: "+name)
            tampered_source=json.loads(json.dumps(source))
            tampered_source["cases"][0]["checkpoints"][0]["gold_visible"]=True
            p=Path(tmp)/"leaky_source.json";p.write_text(json.dumps(tampered_source))
            q=Path(tmp)/"fake_source_matched_report.json"
            view=json.loads(json.dumps(base))
            import hashlib
            view["original_corpus_sha256"]=hashlib.sha256(p.read_bytes()).hexdigest()
            q.write_text(json.dumps(view))
            try:verify(p,q)
            except ValueError:pass
            else:raise AssertionError("explicit unblinded source case accepted")
          print("ALL 6 SOURCE-LEAKAGE / FALSE PHYSICAL REPAIR MUTATIONS REJECTED")
          PY
      - name: Preserve authentic source URLs, actual engine predictions and honest scoring
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hs-four-public-restorations-original-engine-blinded-benchmark
          path: |
            examples/public_restoration_replays/cases_2026_11_03.json
            .cache/hs-public-restoration-blinded-replay/PUBLIC_RESTORATION_BLINDED_REPLAY.json
            .cache/hs-public-restoration-blinded-replay/PUBLIC_RESTORATION_BLINDED_SUMMARY.md
            .cache/hs-public-restoration-blinded-replay/INDEPENDENT_PUBLIC_REPAIR_ACCEPTANCE.json
          retention-days: 30
          if-no-files-found: warn
