name: Stored Source Parser

on:
  workflow_dispatch:
  push:
    paths:
      - "src/hardware_splicer/stored_source_parser.py"
      - "src/hardware_splicer/stored_source_parser_api.py"
      - "src/hardware_splicer/engineering_source_role_api.py"
      - "src/hardware_splicer/project_engineering_plan_api.py"
      - "src/hardware_splicer/product_api.py"
      - "tests/test_stored_source_parser.py"
      - "tests/test_engineering_source_role.py"
      - "tests/test_project_parser_planning_bridge.py"
      - "apps/circuit-ai/circuit-ai-frontend/app/engineering/source-lab/**"
      - "apps/circuit-ai/circuit-ai-frontend/app/engineering/layout.tsx"
      - "apps/circuit-ai/circuit-ai-frontend/app/api/proxy/engineering/projects/**/sources/**/parse/route.ts"
      - "apps/circuit-ai/circuit-ai-frontend/app/api/proxy/engineering/projects/**/sources/**/role/route.ts"
      - "apps/circuit-ai/circuit-ai-frontend/scripts/test-stored-source-parser-workspace.cjs"
      - "docs/STORED_SOURCE_PARSER.md"
      - ".github/workflows/stored-source-parser.yml"
  pull_request:
    paths:
      - "src/hardware_splicer/stored_source_parser.py"
      - "src/hardware_splicer/stored_source_parser_api.py"
      - "src/hardware_splicer/engineering_source_role_api.py"
      - "src/hardware_splicer/project_engineering_plan_api.py"
      - "src/hardware_splicer/product_api.py"
      - "tests/test_stored_source_parser.py"
      - "tests/test_engineering_source_role.py"
      - "tests/test_project_parser_planning_bridge.py"
      - "apps/circuit-ai/circuit-ai-frontend/app/engineering/source-lab/**"
      - "apps/circuit-ai/circuit-ai-frontend/app/engineering/layout.tsx"
      - "apps/circuit-ai/circuit-ai-frontend/app/api/proxy/engineering/projects/**/sources/**/parse/route.ts"
      - "apps/circuit-ai/circuit-ai-frontend/app/api/proxy/engineering/projects/**/sources/**/role/route.ts"
      - "apps/circuit-ai/circuit-ai-frontend/scripts/test-stored-source-parser-workspace.cjs"
      - "docs/STORED_SOURCE_PARSER.md"
      - ".github/workflows/stored-source-parser.yml"

jobs:
  parser-contract:
    name: Stored source parser contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HARDWARE_SPLICER_SKIP_VISION_LIVE: "1"
      HARDWARE_SPLICER_OFFLINE_LLM: "1"
      HARDWARE_SPLICER_OFFLINE_VISION: "1"
      HARDWARE_SPLICER_OFFLINE_SALVAGE: "1"
      QWEN_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Hardware Splicer and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Compile parser and project modules
        run: |
          python -m py_compile \
            src/hardware_splicer/stored_source_parser.py \
            src/hardware_splicer/stored_source_parser_api.py \
            src/hardware_splicer/engineering_source_role_api.py \
            src/hardware_splicer/project_engineering_plan_api.py \
            src/hardware_splicer/product_api.py
      - name: Run focused parser and role tests
        run: |
          PYTHONPATH=src python -m pytest -q \
            tests/test_stored_source_parser.py \
            tests/test_engineering_source_role.py \
            tests/test_project_parser_planning_bridge.py \
            tests/test_project_engineering_plan_api.py
      - uses: actions/setup-node@v4
        if: ${{ !cancelled() }}
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/circuit-ai/circuit-ai-frontend/package-lock.json
      - name: Install frontend dependencies
        if: ${{ !cancelled() }}
        working-directory: apps/circuit-ai/circuit-ai-frontend
        run: npm ci
      - name: Validate Source Lab and production frontend
        if: ${{ !cancelled() }}
        working-directory: apps/circuit-ai/circuit-ai-frontend
        run: |
          node scripts/test-stored-source-parser-workspace.cjs
          npm run typecheck
          npm run build
