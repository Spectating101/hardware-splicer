name: HS CM5 - Manufacturer Reference Routed-Net Integrity

on:
  pull_request:
    paths:
      - 'src/hardware_splicer/cm5_reference_board_netmap.py'
      - 'scripts/hs_cm5_reference_net_overlay.py'
      - 'tests/test_cm5_reference_board_netmap.py'
      - 'examples/cyberdeck/compute_carrier/cm5_reference/**'
      - '.github/workflows/hs-cm5-reference-netmap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-pinned-manufacturer-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HS test dependencies
        run: python -m pip install --disable-pip-version-check -e . 'pytest>=8,<10'
      - name: Validate referenced contact-map records and adversarial gates
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q \
            tests/test_compute_carrier_reference_gate.py \
            tests/test_cm5_pinout_audit.py \
            tests/test_cm5_reference_board_netmap.py
      - name: Download EXACT pinned official source PCB reference
        run: |
          curl -fLsS --retry 3 --connect-timeout 12 --max-time 90 \
            'https://raw.githubusercontent.com/radxa/radxa-som-projects/cf5a4b1984fb4321233d2439320bcaea05af4817/cm5/radxa-cm5-io-board/radxa_cm5_io_board_v2200.asc' \
            -o /tmp/cm5_io_v2200.asc
          echo 'b229b4c5960aad6376e60258b5a5cd62ea7c8e3f31fde94066ef850fb0e3eeed  /tmp/cm5_io_v2200.asc' | sha256sum -c -
      - name: Regenerate and compare manufacturer PADS routed endpoint map
        env:
          PYTHONPATH: src
        run: |
          python -m hardware_splicer.cm5_reference_board_netmap \
            --board-asc /tmp/cm5_io_v2200.asc \
            --vendor-pin-manifest examples/cyberdeck/compute_carrier/cm5_reference/vendor_pin_names.json \
            --output /tmp/cm5_source_net_map.json
          cmp /tmp/cm5_source_net_map.json \
            examples/cyberdeck/compute_carrier/cm5_reference/reference_board_routed_net_map.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/cm5_source_net_map.json').read_text())
          assert x['reference_contacts_with_routes']==241
          assert x['reference_unique_routed_net_names']==159
          assert x['exact_matches_to_manufacturer_names']==235
          assert [c['pin'] for c in x['manufacturer_nc_with_reference_route']]==[290]
          assert not x['safe_to_fabricate']
          assert not x['complete_pcb_drc_pass']
          PY
      - name: Retain source-derived evidence ONLY (not production Gerbers)
        uses: actions/upload-artifact@v4
        with:
          name: HS-CM5-REFERENCE-ROUTED-NET-RESEARCH-ONLY
          retention-days: 30
          path: /tmp/cm5_source_net_map.json
