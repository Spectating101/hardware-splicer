name: HS CM5 - Active SGM2590 USB Power Switch Qualification

on:
  pull_request:
    paths:
      - 'scripts/hs_cm5_sgm2590_successor.py'
      - 'scripts/hs_cm5_5v4v_usb_power_reference.py'
      - 'src/hardware_splicer/cm5_sgm2590_successor_gate.py'
      - 'tests/test_cm5_sgm2590_successor_gate.py'
      - 'examples/cyberdeck/compute_carrier/cm5_reference/sgm2590_candidate/**'
      - '.github/workflows/hs-cm5-sgm2590-successor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-pin-compatible-not-manufacturing-ready:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HS test harness
        run: python -m pip install -e . 'pytest>=8,<10'
      - name: Run all source provenance and electrical net-revision checks
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q \
            tests/test_compute_carrier_reference_gate.py \
            tests/test_cm5_pinout_audit.py \
            tests/test_cm5_reference_board_netmap.py \
            tests/test_cm5_connected_bench_schematic.py \
            tests/test_cm5_power_usb_reference_gate.py \
            tests/test_cm5_sgm2590_successor_gate.py
      - name: Assert SGM2590 five pin identities, real KiCad netlist equivalence and source limits
        env:
          PYTHONPATH: src
        run: |
          python -m hardware_splicer.cm5_sgm2590_successor_gate \
            --new-netlist examples/cyberdeck/compute_carrier/cm5_reference/sgm2590_candidate/CM5_SGM2590_NATIVE_NETLIST.xml \
            --old-netlist examples/cyberdeck/compute_carrier/cm5_reference/CM5_5V4V_USB_REFERENCE_NETLIST.xml \
            --erc examples/cyberdeck/compute_carrier/cm5_reference/sgm2590_candidate/CM5_SGM2590_ERC.txt \
            --contract examples/cyberdeck/compute_carrier/cm5_reference/sgm2590_candidate/sgm2590_source_contract.json \
            --pinout examples/cyberdeck/compute_carrier/cm5_reference/vendor_pin_names.json \
            --output /tmp/hs_sgm2590_evidence.json
          cmp /tmp/hs_sgm2590_evidence.json \
            examples/cyberdeck/compute_carrier/cm5_reference/sgm2590_candidate/sgm2590_validation.json
          python - <<'PY'
          import json
          from pathlib import Path
          obj=json.loads(Path('/tmp/hs_sgm2590_evidence.json').read_text())
          assert obj['successor_model']=='SGM2590XN5G/TR'
          assert obj['five_pin_functions_equivalent']
          assert obj['source_io_net_topology_unchanged']
          assert obj['validated_power_usb_nets']==14
          assert obj['erc_electrical_net_findings']==0
          assert not obj['assembly_authorized']
          assert not obj['esd_and_emi_qualified']
          PY
      - name: Publish review evidence, no Gerber or manufacturing authority
        uses: actions/upload-artifact@v4
        with:
          name: HS-CM5-SGM2590-RESEARCH-NOT-FAB
          retention-days: 30
          path: |
            examples/cyberdeck/compute_carrier/cm5_reference/sgm2590_candidate/CM5_SGM2590_USB_POWER_NOT_FOR_FAB.kicad_sch
            examples/cyberdeck/compute_carrier/cm5_reference/sgm2590_candidate/CM5_SGM2590_NATIVE_NETLIST.xml
            examples/cyberdeck/compute_carrier/cm5_reference/sgm2590_candidate/CM5_SGM2590_ERC.txt
            /tmp/hs_sgm2590_evidence.json
