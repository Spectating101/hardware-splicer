name: Astra Budgeted Canonical MCP Smoke

on:
  pull_request:
    paths:
      - "src/hardware_splicer/codex_budgeted_mcp_proxy.py"
      - "scripts/smoke_budgeted_astra_mcp_relay.py"
      - "tests/test_codex_budgeted_mcp_proxy_process.py"
      - ".github/workflows/astra-budgeted-canonical-mcp-smoke.yml"
  workflow_dispatch:

concurrency:
  group: astra-budgeted-canonical-mcp-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  canonical-governor-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install canonical MCP package and tests
        run: python -m pip install -e '.[dev,backend-mcp]'
      - name: Prove governor hard-disconnect semantics
        run: pytest -q tests/test_codex_budgeted_mcp_proxy_process.py
      - name: Prove real MCP SDK relay into canonical Hardware-Splicer
        run: timeout --signal=TERM --kill-after=5s 60s python scripts/smoke_budgeted_astra_mcp_relay.py
