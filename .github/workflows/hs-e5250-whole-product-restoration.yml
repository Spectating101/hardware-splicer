name: HS Whole Product E5250 Restoration Evidence Dossier
on:
  pull_request:
    paths:
      - ".github/workflows/hs-e5250-whole-product-restoration.yml"
      - "examples/whole_product_restorations/dell_latitude_e5250_technician_case_2026.json"
      - "scripts/run_hs_whole_product_restoration_e5250.py"
      - "scripts/verify_hs_whole_product_restoration_e5250.py"
      - "docs/HS_E5250_PRODUCT_RESTORATION_2026_11_03.md"
  workflow_dispatch:
jobs:
  actual-engine-real-source-whole-product-dossier:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Guarantee same diagnostic code as PR 272 baseline
        run: |
          set -euo pipefail
          git diff --exit-code 92f1584f44002f2081eb0bbaa11235b36aa7692b HEAD -- apps/circuit-ai/src/intelligence
          echo "RESTORATION HARNESS USES EXISTING, UNCHANGED CIRCUIT-AI DIAGNOSTICS"
      - name: Install existing Hardware Splicer and Circuit-AI support
        run: python -m pip install --no-input -e . "numpy>=1.26,<3" "networkx>=3,<4"
      - name: Compile and perform actual 5-stage real repair progression
        run: |
          python -m py_compile scripts/run_hs_whole_product_restoration_e5250.py scripts/verify_hs_whole_product_restoration_e5250.py
          python -m scripts.run_hs_whole_product_restoration_e5250 \
            --case examples/whole_product_restorations/dell_latitude_e5250_technician_case_2026.json \
            --out .cache/hs_e5250_product_restoration
      - name: Independently verify original-source integrity and full-product blockers
        run: |
          python -m scripts.verify_hs_whole_product_restoration_e5250 \
            --case examples/whole_product_restorations/dell_latitude_e5250_technician_case_2026.json \
            --out .cache/hs_e5250_product_restoration \
            | tee .cache/hs_e5250_product_restoration/WHOLE_PRODUCT_EVIDENCE_AUDIT.json
      - name: Publish real run dossier with original engineer predictions and source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hs-e5250-real-laptop-restoration-evidence-and-functional-acceptance
          path: |
            .cache/hs_e5250_product_restoration/*.json
            .cache/hs_e5250_product_restoration/*.md
            docs/HS_E5250_PRODUCT_RESTORATION_2026_11_03.md
            examples/whole_product_restorations/dell_latitude_e5250_technician_case_2026.json
          if-no-files-found: warn
          retention-days: 45
