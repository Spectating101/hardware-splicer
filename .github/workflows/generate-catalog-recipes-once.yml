name: Generate Catalog Recipes Once

on:
  workflow_dispatch:
  push:
    branches:
      - agent/public-visual-adapter-spike-20260805
    paths:
      - .github/workflows/generate-catalog-recipes-once.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/public-visual-adapter-spike-20260805
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/circuit-ai/circuit-ai-frontend/package-lock.json
      - name: Install canonical frontend dependencies
        working-directory: apps/circuit-ai/circuit-ai-frontend
        run: npm ci
      - name: Generate and validate catalog recipes
        run: |
          node scripts/export_catalog_recipes.cjs
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("src/hardware_splicer/data/catalog_recipes.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          assert payload["schema_version"] == "hardware_splicer.catalog_recipes.v1"
          assert len(payload["supported_build_ids"]) >= 4
          assert set(payload["supported_build_ids"]) == set(payload["recipes"])
          assert "automatic_plant_watering" in payload["recipes"]
          assert "bench_power_adapter" in payload["recipes"]
          PY
      - name: Commit canonical generated resource
        env:
          BRANCH: agent/public-visual-adapter-spike-20260805
        run: |
          rm .github/workflows/generate-catalog-recipes-once.yml
          git config user.name "hardware-splicer-ci"
          git config user.email "hardware-splicer-ci@users.noreply.github.com"
          git add -f src/hardware_splicer/data/catalog_recipes.json
          git add .github/workflows/generate-catalog-recipes-once.yml
          git commit -m "Package generated catalog recipe data"
          git push origin HEAD:"$BRANCH"

# Second branch push intentionally triggers this one-shot generator after registration.
