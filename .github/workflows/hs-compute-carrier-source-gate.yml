name: HS Compute Carrier - Reference Quality and Safety (No Fabrication)

on:
  pull_request:
    paths:
      - 'src/hardware_splicer/compute_carrier_reference_gate.py'
      - 'scripts/hs_compute_carrier_gate.py'
      - 'tests/test_compute_carrier_reference_gate.py'
      - 'examples/cyberdeck/compute_carrier/**'
      - '.github/workflows/hs-compute-carrier-source-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-carrier-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HS test dependencies
        run: python -m pip install --disable-pip-version-check -e . 'pytest>=8,<10'
      - name: Audit module pinout data without claiming safe layout
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q tests/test_compute_carrier_reference_gate.py tests/test_pcb_module_registry_data.py
          python scripts/hs_compute_carrier_gate.py
          python - <<'PY'
          import json
          from pathlib import Path
          out=Path('examples/cyberdeck/compute_carrier/evidence/assessment.json')
          a=json.loads(out.read_text())
          assert a['source_designs_available']
          assert not a['safe_to_fabricate']
          assert not a['safe_to_power_any_cross_module_swap']
          assert not a['upstream_db_trusted_for_pinout']
          assert any(x['code']=='identical_upstream_pinout_blobs' for x in a['blockers'])
          PY
      - name: Retain evidence only, no Gerbers or purchasing actions
        uses: actions/upload-artifact@v4
        with:
          name: HS-CM4-CM5-Source-Compatibility-RESEARCH-ONLY
          path: |
            examples/cyberdeck/compute_carrier/evidence/source_contract_20261107.json
            examples/cyberdeck/compute_carrier/evidence/assessment.json
          retention-days: 30
