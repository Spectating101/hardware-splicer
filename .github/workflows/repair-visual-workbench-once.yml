name: Repair Visual Workbench Once

on:
  workflow_dispatch:
  push:
    branches:
      - agent/public-visual-adapter-spike-20260805
    paths:
      - .github/workflows/repair-visual-workbench-once.yml

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/public-visual-adapter-spike-20260805
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/circuit-ai/circuit-ai-frontend/package-lock.json
      - name: Apply exact TypeScript repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "apps/circuit-ai/circuit-ai-frontend/app/api/proxy/_backend.ts": [
                  (
                      "export function getProxyAuthHeaders(request?: Request): HeadersInit {",
                      "export function getProxyAuthHeaders(request?: Request): Record<string, string> {",
                  ),
              ],
              "apps/circuit-ai/circuit-ai-frontend/app/build/page.tsx": [
                  (
                      "const result: TranslationResult = {\n          graph: remote.graph,\n          notes: remote.notes ?? [],",
                      "const result: TranslationResult = {\n          graph: remote.graph,\n          buildId,\n          notes: remote.notes ?? [],",
                  ),
              ],
              "apps/circuit-ai/circuit-ai-frontend/components/build/salvage-import-modal.tsx": [
                  (
                      "onImport({\n          graph: remote.graph,\n          notes: remote.notes ?? [`Imported \"${buildId}\" via Python engine.`],",
                      "onImport({\n          graph: remote.graph,\n          buildId,\n          notes: remote.notes ?? [`Imported \"${buildId}\" via Python engine.`],",
                  ),
              ],
              "apps/circuit-ai/circuit-ai-frontend/components/workspace/canvas.tsx": [
                  (
                      "  type NodeTypes,\n} from \"@xyflow/react\";",
                      "  type NodeTypes,\n  type OnNodeDrag,\n} from \"@xyflow/react\";",
                  ),
                  (
                      "  const onNodeDragStop = useCallback(\n    (_: React.MouseEvent, node: Node) => {",
                      "  const onNodeDragStop: OnNodeDrag = useCallback(\n    (_event, node: Node) => {",
                  ),
              ],
              "apps/circuit-ai/circuit-ai-frontend/lib/firmware/zip-store.ts": [
                  (
                      "  return new Blob([concat([localData, centralDir, end])], { type: \"application/zip\" });",
                      "  const archiveBytes = concat([localData, centralDir, end]);\n  const archiveBuffer = new ArrayBuffer(archiveBytes.byteLength);\n  new Uint8Array(archiveBuffer).set(archiveBytes);\n  return new Blob([archiveBuffer], { type: \"application/zip\" });",
                  ),
              ],
              "apps/circuit-ai/circuit-ai-frontend/lib/rules/safety-rules.ts": [
                  (
                      "if (/adjust|trim|set/i.test(src.pin.voltage) || /adjust|trim|set/i.test(src.pin.notes ?? \"\")) {",
                      "if (/adjust|trim|set/i.test(src.pin.voltage ?? \"\") || /adjust|trim|set/i.test(src.pin.notes ?? \"\")) {",
                  ),
              ],
          }

          for raw_path, edits in replacements.items():
              path = Path(raw_path)
              content = path.read_text()
              for old, new in edits:
                  count = content.count(old)
                  if count != 1:
                      raise SystemExit(f"Expected exactly one match in {path} for {old[:80]!r}; found {count}")
                  content = content.replace(old, new)
              path.write_text(content)
          PY
      - name: Validate frontend
        working-directory: apps/circuit-ai/circuit-ai-frontend
        run: |
          npm ci
          node scripts/test-visual-engineering-workbench.cjs
          npm run typecheck
          npm run build
      - name: Commit validated repairs
        env:
          BRANCH: agent/public-visual-adapter-spike-20260805
        run: |
          rm .github/workflows/repair-visual-workbench-once.yml
          git config user.name "hardware-splicer-ci"
          git config user.email "hardware-splicer-ci@users.noreply.github.com"
          git add -A
          git commit -m "Repair frontend build blockers for visual workbench"
          git push origin HEAD:"$BRANCH"
      - name: Dispatch exact-head visual validation
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: agent/public-visual-adapter-spike-20260805
        run: gh workflow run visual-engineering-workbench.yml --ref "$BRANCH"
