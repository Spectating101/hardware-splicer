name: HS Native WHOOP65 — Build Product with Actual HS Engines
on:
  pull_request:
    paths:
      - "src/hardware_splicer/drone_product_delivery.py"
      - "apps/mecha-splicer/**"
      - "examples/drone_lab/**"
      - ".github/workflows/hs-native-drone-product.yml"
  workflow_dispatch:
jobs:
  build-downloadable-hs-drone-product:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build one whole drone package via native HS topology and Mecha-Splicer geometry
        env:
          HS_APPIMAGE_EXTRACT_AND_RUN: "1"
          HS_DRONE_PRODUCT_CACHE: "${{ github.workspace }}/.cache/product-deps"
          HS_DRONE_PRODUCT_OUTPUT: "${{ github.workspace }}/.cache/HS_WHOOP65_PRODUCT"
        run: |
          bash examples/drone_lab/produce_with_hs.sh | tee hs-native-product-result.json
      - name: Publish actual manufactured files and working simulation, not just CI status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HS-NATIVE-DRONE-REAL-STL-SCAD-BOM-TOPOLOGY-AND-FLIGHT
          path: |
            .cache/HS_WHOOP65_PRODUCT-DELIVERABLE.zip
            hs-native-product-result.json
          if-no-files-found: error
          retention-days: 90
