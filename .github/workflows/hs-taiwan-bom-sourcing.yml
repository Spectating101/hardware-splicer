name: HS Dual-Touch Taiwan Component Sourcing (Research Only)

on:
  pull_request:
    paths:
      - 'src/hardware_splicer/taiwan_sourcing_budget.py'
      - 'scripts/hs_taiwan_sourcing_budget.py'
      - 'tests/test_taiwan_sourcing_budget.py'
      - 'examples/cyberdeck/dual_touch/sourcing/**'
      - '.github/workflows/hs-taiwan-bom-sourcing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-supplier-variant-and-unquoted-costs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HS and unit tests
        run: python -m pip install --disable-pip-version-check -e . 'pytest>=8,<10'
      - name: Recompute BOM with source status guardrails
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q tests/test_taiwan_sourcing_budget.py tests/test_commercial_evidence_bridge.py tests/test_machine_project.py
          python scripts/hs_taiwan_sourcing_budget.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('examples/cyberdeck/dual_touch/sourcing/taiwan_budget_receipt.json')
          r=json.loads(p.read_text())
          assert r['purchase_authorized'] is False
          assert r['scenarios']['full_exterior_concept']['total_twd'] == 4277
          PY
      - name: Publish inspectable sourcing scenarios (NOT a purchase order)
        uses: actions/upload-artifact@v4
        with:
          name: HS-Taiwan-Components-UNQUOTED-Research
          path: |
            examples/cyberdeck/dual_touch/sourcing/taiwan_snapshot_20261106.json
            examples/cyberdeck/dual_touch/sourcing/taiwan_budget_receipt.json
          retention-days: 30
