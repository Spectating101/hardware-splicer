name: HS hinge pin retention and routed cable geometry
on:
  pull_request:
    paths:
      - 'src/hardware_splicer/functional_hinge_retention.py'
      - 'examples/functional_hinge_retention/**'
      - 'tests/test_functional_hinge_retention.py'
      - '.github/workflows/hs-hinge-retention-cable.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-hardware-reference-and-source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HS native BRep, mesh and numeric geometry dependencies
        run: |
          python -m pip install -e .
          python -m pip install 'cadquery==2.6.1' 'trimesh==4.12.2' 'pytest>=8,<10'
      - name: Actual pin STEP, C-rings, route flex geometry, 181-pose evidence and tamper tests
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q tests/test_functional_hinge_retention.py \
            tests/test_functional_hinge_assembly.py \
            tests/test_functional_hinge_slicer.py
      - name: Reimport original source-pinned metal and cable STEP geometry
        env:
          PYTHONPATH: src
        run: |
          python examples/functional_hinge_retention/run.py --audit-only
      - name: Rebuild the entire 37-plus-181-pose model afresh
        env:
          PYTHONPATH: src
        run: |
          python examples/functional_hinge_retention/run.py --out /tmp/hs_retention_fresh_CI
