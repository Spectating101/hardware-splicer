name: Astra MCP Governor Process Smoke

on:
  pull_request:
    paths:
      - "src/hardware_splicer/codex_budgeted_mcp_proxy.py"
      - "tests/test_codex_budgeted_mcp_proxy_process.py"
      - ".github/workflows/astra-resource-guard-process.yml"
  workflow_dispatch:

concurrency:
  group: astra-mcp-governor-process-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  process-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and tests
        run: python -m pip install -e '.[dev]'
      - name: Exercise hard disconnect behavior
        run: pytest -q tests/test_codex_budgeted_mcp_proxy_process.py
