name: HS CM4 Thin Dual-Touch Stack & Hinge Gate
on:
  pull_request:
    paths:
      - '.github/workflows/hs-cm4-thin-stack.yml'
      - 'src/hardware_splicer/cyberdeck_cm4_stack.py'
      - 'tests/test_cyberdeck_cm4_stack.py'
      - 'examples/cyberdeck/cm4_thin_stack/**'
      - 'apps/mecha-splicer/src/mecha_splicer/spec.py'
      - 'apps/mecha-splicer/src/mecha_splicer/engines/bom.py'
      - 'apps/mecha-splicer/src/mecha_splicer/engines/dfm.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-vendor-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HS
        run: python -m pip install -e . 'pytest>=8,<10'
      - name: Regenerate through native HS MechanicalFit and Mecha-Splicer
        env:
          PYTHONPATH: src:apps/mecha-splicer:apps/mecha-splicer/src
        run: |
          python -m hardware_splicer.cyberdeck_cm4_stack \
            --requirements examples/cyberdeck/cm4_thin_stack/requirements.json \
            --out examples/cyberdeck/cm4_thin_stack/evidence
          git diff --exit-code -- examples/cyberdeck/cm4_thin_stack/evidence
      - name: Test adversarial clearance, physical SKU and safe power gates
        env:
          PYTHONPATH: src:apps/mecha-splicer:apps/mecha-splicer/src
        run: |
          python -m pytest -q \
            tests/test_cyberdeck_cm4_stack.py \
            tests/test_cyberdeck_architecture_value.py \
            tests/test_cyberdeck_packaging_workflow.py \
            tests/test_machine_project.py \
            apps/mecha-splicer/tests/test_bundle.py
      - name: Install native OpenSCAD CGAL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openscad
      - name: Actually export native shell meshes and inspect true hinge envelope
        env:
          PYTHONPATH: src:apps/mecha-splicer:apps/mecha-splicer/src:examples/cyberdeck
        run: |
          python - <<'PY'
          from pathlib import Path
          from produce_terminal import run
          root=Path("examples/cyberdeck/cm4_thin_stack/evidence").resolve()
          report=run(root/"native_project_spec.json",root/"native_mecha","/usr/bin/openscad")
          assert all(x["nonmanifold_edges"]==0 for x in report["mesh"].values())
          assert len(report["cgal_interference_sweep"])==6
          assert all(x["interference_mesh"]=="EMPTY" for x in report["cgal_interference_sweep"])
          assert report["mesh"]["base_shell"]["bbox_mm"][1]==84.6
          assert not report["physical_fit_tested"]
          assert not report["actual_unit_assembled"]
          PY
      - name: Block false 18mm full-device approval
        run: |
          python - <<'PY'
          import json
          p="examples/cyberdeck/cm4_thin_stack/evidence/cm4_stack_result.json"
          r=json.load(open(p))
          assert r["required_closed_xyz_mm"]==[155.0,80.0,18.0]
          assert r["native_clamshell_hinge_included_xyz_mm"]==[155.0,84.6,18.0]
          assert r["whole_device_pocket_envelope_met"] is False
          assert r["sensitivity_any_failed"]
          assert r["decision"]=="NOMINAL_INTERNAL_STACK_BUT_HINGE_EXCEEDS_POCKET_LIMIT"
          assert not r["manufacturing_authorized"]
          assert not r["safe_to_power"]
          assert r["release_assessment"]["blockers"]
          PY
      - name: Retain HS mechanical research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hs-cm4-thin-dual-touch-not-fabricable
          retention-days: 30
          path: examples/cyberdeck/cm4_thin_stack/evidence
