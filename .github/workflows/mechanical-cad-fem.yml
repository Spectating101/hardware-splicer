jobs:
  cad-fem:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install headless Gmsh runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libglu1-mesa
      - name: Install bounded FEM and meshing dependencies
        run: python -m pip install -e '.[dev,physics,cad-meshing,physics-validation]'
      - name: Prove STEP/STL meshing and structural screening
        env:
          PYTHONPATH: apps/mecha-splicer/src
        run: python -m pytest -q tests/test_mechanical_cad_fem.py tests/test_mechanical_cad_convergence.py tests/test_mechanical_cad_local_refinement.py tests/test_mechanical_fem.py tests/test_mechanical_fem_crosscheck.py tests/test_mechanical_quadratic_fem.py tests/test_mechanical_curved_fem.py tests/test_mechanical_kirsch_reference.py tests/test_mechanical_fastener_bearing.py tests/test_mechanical_unilateral_pin_contact.py tests/test_mechanical_contact_complementarity.py tests/test_mechanical_contact_workbench.py tests/test_mechanical_workflow_integration.py tests/test_construction_alternatives.py tests/test_mechanical_authority.py tests/test_mechatronics_authority.py
