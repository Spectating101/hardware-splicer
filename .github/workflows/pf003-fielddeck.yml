name: PF-003 FieldDeck

on:
  pull_request:
    paths:
      - "hardware/reference_designs/fielddeck_v0/**"
      - "experiments/product_factory/run-003-fielddeck.json"
      - "experiments/product_factory/donor_probes/fielddeck_aim8i_supply_route.json"
      - "experiments/product_factory/evaluate_supply_route.py"
      - "tests/test_product_factory_fielddeck.py"
      - ".github/workflows/pf003-fielddeck.yml"

jobs:
  concept-gate:
    name: PF-003 cyberdeck economics + authority gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HS test environment
        run: python -m pip install -e ".[dev]"
      - name: Evaluate AIM8I donor route
        run: |
          python experiments/product_factory/evaluate_supply_route.py \
            experiments/product_factory/donor_probes/fielddeck_aim8i_supply_route.json \
            --output /tmp/pf003_supply.json
          cat /tmp/pf003_supply.json
          grep -q '"decision": "HOLD_SUPPLY_ROUTE"' /tmp/pf003_supply.json
          grep -q '"supply_depth": false' /tmp/pf003_supply.json
          grep -q '"yield_evidence": false' /tmp/pf003_supply.json
      - name: Run PF-003 contract tests
        run: python -m pytest -q tests/test_product_factory_fielddeck.py
