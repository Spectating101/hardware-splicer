name: HS Function-First System Contract

on:
  pull_request:
    paths:
      - "src/hardware_splicer/function_intent_bridge.py"
      - "examples/functionality/**"
      - "scripts/compile_function_intent_001.py"
      - "tests/test_function_intent_bridge.py"
      - "src/hardware_splicer/function_technology_selection.py"
      - "scripts/compare_function_technologies_001.py"
      - "tests/test_function_technology_selection.py"
      - ".github/workflows/function-first-system-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  functional-system-traceability:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install machine project model and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Test function allocation, real MachineProject validation and rejection of false claims
        run: pytest -q tests/test_function_intent_bridge.py
      - name: Compile non-potable function-first reference
        run: |
          python scripts/compile_function_intent_001.py \
            --brief examples/functionality/water_filter_nonpotable_bench_001.json \
            --out .cache/hs-function-first-water-001
      - name: Independently confirm source binding and closed real-world authority
        shell: python
        run: |
          import hashlib,json
          from pathlib import Path
          root=Path(".cache/hs-function-first-water-001")
          receipt=json.loads((root/"PACKAGE_RECEIPT.json").read_text())
          gate=json.loads((root/"FUNCTIONAL_GATE.json").read_text())
          machine=json.loads((root/"MACHINE_PROJECT.json").read_text())
          for name,record in receipt["files"].items():
              data=(root/name).read_bytes()
              assert len(data)==record["bytes"] and hashlib.sha256(data).hexdigest()==record["sha256"]
          assert receipt["source_spec_sha256"]==gate["source_spec_sha256"]
          assert machine["metadata"]["source_spec_sha256"]==gate["source_spec_sha256"]
          assert len(machine["requirements"])==gate["requirements_count"]
          assert len(machine["functions"])==gate["functions_count"]
          assert len(machine["verifications"])==gate["planned_independent_tests"]
          packages=json.loads((root/"DISCIPLINE_WORK_PACKAGES.json").read_text())
          assert packages["source_spec_sha256"]==gate["source_spec_sha256"]
          assert len(packages["packages"])==len(machine["subsystems"])
          assert not packages["physical_authority_granted"]
          assert all(not p["native_design_outputs_generated"] for p in packages["packages"])
          assert all(p["verification_status"]=="not_executed" for p in packages["packages"])
          assert gate["evidence_collected_count"]==0
          assert not any(gate["physical_authority"].values())
          assert machine["requested_release_state"]=="concept"
          assert all(x["status"]=="planned" for x in machine["verifications"])
          assert all(x["authority"]=="proposed" for x in machine["interfaces"])
          assert all(x["contracts"][0]["unresolved_fields"] for x in machine["interfaces"])
          print("MachineProject function-first traceability: validated concept; no water treatment, drinking, fabrication or activation authority.")
      - name: Retain exact proposed functional package and evidence
        uses: actions/upload-artifact@v4
        with:
          name: hs-function-first-water-filter-concept-001
          path: .cache/hs-function-first-water-001/
          retention-days: 30
          if-no-files-found: error

  technology-option-screening:
    needs: functional-system-traceability
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install existing HS machine project schema dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run adversarial option-screening tests
        run: pytest -q tests/test_function_technology_selection.py
      - name: Load function evidence package from preceding independent job
        uses: actions/download-artifact@v4
        with:
          name: hs-function-first-water-filter-concept-001
          path: .cache/hs-function-first-water-001
      - name: Compare real functional requirements with four proposed process mechanisms
        run: |
          python scripts/compare_function_technologies_001.py \
            --functional-package .cache/hs-function-first-water-001 \
            --options examples/functionality/water_filter_technology_options_001.json \
            --out .cache/hs-filter-technology-study
      - name: Confirm independently bound provisional architecture and physically closed gates
        shell: python
        run: |
          import hashlib,json
          from pathlib import Path
          root=Path(".cache/hs-filter-technology-study")
          receipt=json.loads((root/"TECHNOLOGY_STUDY_RECEIPT.json").read_text())
          decision=json.loads((root/"TECHNOLOGY_DECISION.json").read_text())
          handoff=json.loads((root/"PROVISIONAL_ARCHITECTURE_HANDOFF.json").read_text())
          for name, info in receipt["files"].items():
              content=(root/name).read_bytes()
              assert hashlib.sha256(content).hexdigest()==info["sha256"]
              assert len(content)==info["bytes"]
          assert receipt["source_spec_sha256"]==decision["source_spec_sha256"]==handoff["source_spec_sha256"]
          assert receipt["technology_options_sha256"]==decision["technology_options_sha256"]==handoff["technology_options_sha256"]
          assert decision["selection_state"]=="PROVISIONAL_FOR_DESIGN_STUDY_ONLY"
          assert decision["provisional_preferred_candidate_id"]=="passive_replaceable_depth_media"
          assert set(decision["candidate_ids_eligible_for_design_study"])=={
              "passive_replaceable_depth_media","active_membrane_cartridge"}
          assert len([c for c in decision["candidate_screening"] if
                      c["screening_state"]=="REJECT_INCOMPLETE_FUNCTIONAL_COVERAGE"])==2
          assert len(handoff["discipline_assignments"])==5
          assert not any([
              decision["demonstrated_contaminant_reduction"],
              decision["water_quality_measured"],
              decision["physical_build_authorized"],
              decision["human_consumption_authorized"],
              handoff["physical_authority_granted"],
              handoff["process_design_verified"],
              handoff["native_toolchain_executed"],
          ])
          print("Technology shortlist is a hypothesis-based design study only; no verified water-quality or build authority.")
      - name: Retain source-bound alternatives, decision and engineering study handoff
        uses: actions/upload-artifact@v4
        with:
          name: hs-water-filter-technology-study-001
          path: .cache/hs-filter-technology-study/
          if-no-files-found: error
          retention-days: 30
