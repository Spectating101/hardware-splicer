name: HS SORTCELL Original OpenArm Wrist DAE STL Surface Evidence
on:
  pull_request:
    paths:
      - ".github/workflows/sortcell-source-wrist-surface-geometry.yml"
      - "scripts/audit_sortcell_wrist_dae_stl_surfaces_001.py"
      - "scripts/verify_sortcell_wrist_surface_audit_001.py"
      - "scripts/probe_sortcell_original_wrist_triangle_contacts_001.py"
      - "scripts/verify_sortcell_wrist_convexification_gap_001.py"
      - "tests/fixtures/sortcell_original_source_wrist_fk_reference_001.json"
  workflow_dispatch:
jobs:
  pinned-source-wrist-surfaces:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned triangle surface analysis libraries
        run: |
          python -m pip install --no-input 'numpy>=1.26,<3' 'scipy>=1.13,<2' \
            'trimesh==4.6.8' 'pycollada>=0.8,<1' 'lxml>=5,<7' 'python-fcl==0.7.0.11'
      - name: Download unchanged pinned manufacturer OpenArm v1.0 URDF
        run: |
          mkdir -p .cache/original-manufacturer-geometry
          curl -fLsS --retry 3 --retry-delay 2 \
            https://raw.githubusercontent.com/enactic/openarm_description/2e27c793e10aa2045e7eb597b9b9b9dc08fb0a08/assets/robot/openarm_v1.0/urdf/example/v1.urdf \
            -o .cache/original-manufacturer-geometry/openarm_v10.urdf
      - name: Measure official visual DAE vs collision STL source wrist surfaces
        run: |
          python -m scripts.audit_sortcell_wrist_dae_stl_surfaces_001 \
            --urdf .cache/original-manufacturer-geometry/openarm_v10.urdf \
            --output .cache/original-manufacturer-geometry/wrist-surface-audit
      - name: Independently validate manufacturer provenance, mesh sample metrics and fail-closed authority
        run: |
          python -m scripts.verify_sortcell_wrist_surface_audit_001 \
            --urdf .cache/original-manufacturer-geometry/openarm_v10.urdf \
            --study .cache/original-manufacturer-geometry/wrist-surface-audit/WRIST_VISUAL_DAE_VS_COLLISION_STL.json \
            --output .cache/original-manufacturer-geometry/wrist-surface-audit/SURFACE_AUDIT_ACCEPTANCE.json
      - name: Compare original assembled source wrist triangles against PyBullet-verified source joint poses
        run: |
          python -m scripts.probe_sortcell_original_wrist_triangle_contacts_001 \
            --urdf .cache/original-manufacturer-geometry/openarm_v10.urdf \
            --study .cache/original-manufacturer-geometry/wrist-surface-audit/WRIST_VISUAL_DAE_VS_COLLISION_STL.json \
            --poses tests/fixtures/sortcell_original_source_wrist_fk_reference_001.json \
            --output .cache/original-manufacturer-geometry/wrist-surface-audit/ASSEMBLED_WRIST_DAE_STL_FCL_TRIANGLE_CONTACTS.json
      - name: Independently verify original BVH triangle versus derived convex-hull disagreement
        run: |
          python -m scripts.verify_sortcell_wrist_convexification_gap_001 \
            --urdf .cache/original-manufacturer-geometry/openarm_v10.urdf \
            --study .cache/original-manufacturer-geometry/wrist-surface-audit/WRIST_VISUAL_DAE_VS_COLLISION_STL.json \
            --poses tests/fixtures/sortcell_original_source_wrist_fk_reference_001.json \
            --contacts .cache/original-manufacturer-geometry/wrist-surface-audit/ASSEMBLED_WRIST_DAE_STL_FCL_TRIANGLE_CONTACTS.json \
            --output .cache/original-manufacturer-geometry/wrist-surface-audit/WRIST_CONVEXIFICATION_GAP_ACCEPTANCE.json
      - name: Summarize measured original source wrist DAE vs STL differences
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path(".cache/original-manufacturer-geometry/wrist-surface-audit/WRIST_VISUAL_DAE_VS_COLLISION_STL.json")
          r=json.loads(p.read_text())
          for x in r["six_source_wrist_link_comparisons"]:
              d=x["sampled_surface_comparison"]
              print(x["source_link_name"],"visual faces",x["original_source_visual_mesh"]["triangle_faces"],
                    "collision faces",x["original_source_collision_mesh"]["triangle_faces"],
                    "bidirectional p95 surface distance (m)",d["symmetric_sampled_p95_distance_m"],
                    "sampled max (m)",d["symmetric_sampled_max_distance_m"])
          print("CERTIFIED COLLISION FREE:", False)
          print("SOURCE v1.1 RIGID REGISTRATION:", False)
          PY
      - name: Preserve original source geometry and inspectable quantitative comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hs-sortcell-original-source-wrist-dae-vs-stl-evidence
          path: |
            .cache/original-manufacturer-geometry/openarm_v10.urdf
            .cache/original-manufacturer-geometry/wrist-surface-audit/WRIST_VISUAL_DAE_VS_COLLISION_STL.json
            .cache/original-manufacturer-geometry/wrist-surface-audit/SURFACE_AUDIT_ACCEPTANCE.json
            .cache/original-manufacturer-geometry/wrist-surface-audit/ASSEMBLED_WRIST_DAE_STL_FCL_TRIANGLE_CONTACTS.json
            .cache/original-manufacturer-geometry/wrist-surface-audit/WRIST_CONVEXIFICATION_GAP_ACCEPTANCE.json
            .cache/original-manufacturer-geometry/wrist-surface-audit/manufacturer-source/**
          retention-days: 30
          if-no-files-found: warn
