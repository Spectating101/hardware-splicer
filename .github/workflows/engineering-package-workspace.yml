name: Engineering Package Workspace

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/circuit-ai/circuit-ai-frontend/app/engineering/packages/**"
      - "apps/circuit-ai/circuit-ai-frontend/app/engineering/layout.tsx"
      - "apps/circuit-ai/circuit-ai-frontend/app/api/proxy/engineering/projects/**/engineering-packages/**"
      - "apps/circuit-ai/circuit-ai-frontend/scripts/test-engineering-package-workspace.cjs"
      - "docs/ENGINEERING_PACKAGE_WORKSPACE.md"
      - ".github/workflows/engineering-package-workspace.yml"
  pull_request:
    paths:
      - "apps/circuit-ai/circuit-ai-frontend/app/engineering/packages/**"
      - "apps/circuit-ai/circuit-ai-frontend/app/engineering/layout.tsx"
      - "apps/circuit-ai/circuit-ai-frontend/app/api/proxy/engineering/projects/**/engineering-packages/**"
      - "apps/circuit-ai/circuit-ai-frontend/scripts/test-engineering-package-workspace.cjs"
      - "docs/ENGINEERING_PACKAGE_WORKSPACE.md"
      - ".github/workflows/engineering-package-workspace.yml"

jobs:
  package-ui-contract:
    name: Engineering Package product contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/circuit-ai/circuit-ai-frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/circuit-ai/circuit-ai-frontend
        run: npm ci
      - name: Validate Engineering Package workspace
        working-directory: apps/circuit-ai/circuit-ai-frontend
        run: node scripts/test-engineering-package-workspace.cjs
      - name: Run strict TypeScript
        working-directory: apps/circuit-ai/circuit-ai-frontend
        run: npm run typecheck
      - name: Build production frontend
        working-directory: apps/circuit-ai/circuit-ai-frontend
        run: npm run build
