name: HS CM5 - Official Pinout to Real KiCad (Source-Gated)

on:
  pull_request:
    paths:
      - 'src/hardware_splicer/cm5_pinout_audit.py'
      - 'scripts/hs_cm5_footprint_fixture.py'
      - 'tests/test_cm5_pinout_audit.py'
      - 'examples/cyberdeck/compute_carrier/cm5_reference/**'
      - '.github/workflows/hs-cm5-pinout-kicad.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify_manufacturer_contacts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HS test runner
        run: python -m pip install --disable-pip-version-check -e . 'pytest>=8,<10'
      - name: Audit committed manufacturer-source pin manifest and native symbol
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q tests/test_cm5_pinout_audit.py
      - name: Fetch pinned official Radxa XLSX and pinned MIT KiCad library
        run: |
          mkdir -p /tmp/hs-cm5-source /tmp/hs-cm5-generated
          curl -fLsS --retry 3 --connect-timeout 12 --max-time 90 \
            'https://dl.radxa.com/cm5/v2210/radxa_cm5_v2210_pinout.xlsx' \
            -o /tmp/hs-cm5-source/official.xlsx
          curl -fLsS --retry 3 --connect-timeout 12 --max-time 90 \
            'https://raw.githubusercontent.com/swdee/radxa-cm5-kicad/33add7f768b313ddef58c81eca8f2d1c8004ac66/symbols/Radxa_CM5.kicad_sym' \
            -o /tmp/hs-cm5-source/original.kicad_sym
          curl -fLsS --retry 3 --connect-timeout 12 --max-time 90 \
            'https://raw.githubusercontent.com/swdee/radxa-cm5-kicad/33add7f768b313ddef58c81eca8f2d1c8004ac66/footprints/Radxa_CM5.kicad_mod' \
            -o /tmp/hs-cm5-source/original.kicad_mod
      - name: Regenerate the full 300-pad manufacturer-accurate symbol
        env:
          PYTHONPATH: src
        run: |
          python -m hardware_splicer.cm5_pinout_audit \
            --official /tmp/hs-cm5-source/official.xlsx \
            --symbol /tmp/hs-cm5-source/original.kicad_sym \
            --footprint /tmp/hs-cm5-source/original.kicad_mod \
            --output-dir /tmp/hs-cm5-generated
          cmp /tmp/hs-cm5-generated/HS_CM5_OFFICIAL.kicad_sym \
            examples/cyberdeck/compute_carrier/cm5_reference/HS_CM5_OFFICIAL.kicad_sym
          cmp /tmp/hs-cm5-generated/HS_CM5_OFFICIAL.pretty/Radxa_CM5.kicad_mod \
            examples/cyberdeck/compute_carrier/cm5_reference/HS_CM5_OFFICIAL.pretty/Radxa_CM5.kicad_mod
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/hs-cm5-generated/pinout_audit.json').read_text())
          assert x['vendor_contact_count']==300
          assert x['footprint_pad_count']==300
          assert x['pin_name_differences']==192
          assert x['manufacturer_NC_conflicts']==22
          assert x['pin_names_after_patch_match_vendor']
          assert not x['released_for_fabrication']
          PY
      - name: Publish verified contact identity only, not Gerbers
        uses: actions/upload-artifact@v4
        with:
          name: HS-CM5-Pinout-KiCad-REFERENCE-ONLY
          retention-days: 30
          path: |
            /tmp/hs-cm5-generated/HS_CM5_OFFICIAL.kicad_sym
            /tmp/hs-cm5-generated/HS_CM5_OFFICIAL.pretty/Radxa_CM5.kicad_mod
            /tmp/hs-cm5-generated/pinout_audit.json

