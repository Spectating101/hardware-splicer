name: Unseen SPI Flash Cleanroom

on:
  pull_request:
    paths:
      - "src/hardware_splicer/cleanroom_unseen_spi_flash_experiment.py"
      - "src/hardware_splicer/cleanroom_replay.py"
      - "src/hardware_splicer/cleanroom_retrospective.py"
      - "src/hardware_splicer/cleanroom_perturbations.py"
      - "src/hardware_splicer/cleanroom_revision_challenges.py"
      - "src/hardware_splicer/cleanroom_truth_audit.py"
      - "src/hardware_splicer/dual_agent_cleanroom.py"
      - "tests/test_cleanroom_unseen_spi_flash_experiment.py"
      - "scripts/run_unseen_spi_flash_experiment.py"
      - ".github/workflows/unseen-spi-flash-cleanroom.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unseen-spi-flash-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  corpus-validation:
    name: Fresh unseen corpus validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run unseen-case tests
        run: pytest -q tests/test_cleanroom_unseen_spi_flash_experiment.py

      - name: Persist corpus validation report
        run: python scripts/run_unseen_spi_flash_experiment.py --mode validate --out-dir artifacts/unseen-spi-flash

      - name: Upload unseen corpus evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unseen-spi-flash-corpus
          path: artifacts/unseen-spi-flash
          if-no-files-found: error

  live-provider:
    name: Live source-blind operator on unseen case
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      HARDWARE_SPLICER_LLM_PROVIDER: qwen
      HARDWARE_SPLICER_LLM_CACHE: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
        
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Detect provider secret
        id: provider
        shell: bash
        run: |
          mkdir -p artifacts/unseen-spi-flash-live
          if [[ -n "${QWEN_API_KEY}" || -n "${DASHSCOPE_API_KEY}" ]]; then
            echo "available=1" >> "$GITHUB_OUTPUT"
            echo "provider secret present" > artifacts/unseen-spi-flash-live/PROVIDER_STATUS.txt
          else
            echo "available=0" >> "$GITHUB_OUTPUT"
            echo "live unseen probe skipped: no QWEN_API_KEY or DASHSCOPE_API_KEY secret" > artifacts/unseen-spi-flash-live/PROVIDER_STATUS.txt
          fi

      - name: Run live unseen cleanroom replay
        if: steps.provider.outputs.available == '1'
        run: python scripts/run_unseen_spi_flash_experiment.py --mode live --out-dir artifacts/unseen-spi-flash-live

      - name: Upload live unseen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unseen-spi-flash-live
          path: artifacts/unseen-spi-flash-live
          if-no-files-found: error
