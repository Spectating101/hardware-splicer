name: AI Studio Preview Results

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/circuit-ai/circuit-ai-frontend/app/engineering/ai-studio/page.tsx"
      - "apps/circuit-ai/circuit-ai-frontend/app/api/proxy/engineering/projects/**/execute-preview/**"
      - "apps/circuit-ai/circuit-ai-frontend/scripts/test-ai-studio-preview-results.cjs"
      - "docs/AI_STUDIO_PREVIEW_RESULTS.md"
      - ".github/workflows/ai-studio-preview-results.yml"
  pull_request:
    paths:
      - "apps/circuit-ai/circuit-ai-frontend/app/engineering/ai-studio/page.tsx"
      - "apps/circuit-ai/circuit-ai-frontend/app/api/proxy/engineering/projects/**/execute-preview/**"
      - "apps/circuit-ai/circuit-ai-frontend/scripts/test-ai-studio-preview-results.cjs"
      - "docs/AI_STUDIO_PREVIEW_RESULTS.md"
      - ".github/workflows/ai-studio-preview-results.yml"

jobs:
  frontend-contract:
    name: Review-to-preview product loop
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/circuit-ai/circuit-ai-frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/circuit-ai/circuit-ai-frontend
        run: npm ci
      - name: Validate preview UI contract
        working-directory: apps/circuit-ai/circuit-ai-frontend
        run: node scripts/test-ai-studio-preview-results.cjs
      - name: Run strict TypeScript validation
        working-directory: apps/circuit-ai/circuit-ai-frontend
        run: npm run typecheck
      - name: Build production frontend
        working-directory: apps/circuit-ai/circuit-ai-frontend
        run: npm run build
