name: HS Preflight UI

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/circuit-ai/circuit-ai-frontend/app/engineering/preflight/**"
      - "apps/circuit-ai/circuit-ai-frontend/app/api/proxy/engineering/plans/save/**"
      - "apps/circuit-ai/circuit-ai-frontend/components/hs-preflight-workbench.tsx"
      - "apps/circuit-ai/circuit-ai-frontend/lib/hs-preflight.ts"
      - "apps/circuit-ai/circuit-ai-frontend/scripts/test-engineering-preflight-ui.cjs"
      - "tests/test_hs_preflight_api_contract.py"
      - ".github/workflows/hs-preflight-ui.yml"
  pull_request:
    paths:
      - "apps/circuit-ai/circuit-ai-frontend/app/engineering/preflight/**"
      - "apps/circuit-ai/circuit-ai-frontend/app/api/proxy/engineering/plans/save/**"
      - "apps/circuit-ai/circuit-ai-frontend/components/hs-preflight-workbench.tsx"
      - "apps/circuit-ai/circuit-ai-frontend/lib/hs-preflight.ts"
      - "apps/circuit-ai/circuit-ai-frontend/scripts/test-engineering-preflight-ui.cjs"
      - "tests/test_hs_preflight_api_contract.py"
      - ".github/workflows/hs-preflight-ui.yml"

jobs:
  preflight:
    name: Preflight API, contract, types and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Hardware Splicer and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Run real planning and persistence contract
        env:
          HARDWARE_SPLICER_SKIP_VISION_LIVE: "1"
          HARDWARE_SPLICER_OFFLINE_LLM: "1"
          HARDWARE_SPLICER_OFFLINE_VISION: "1"
          HARDWARE_SPLICER_OFFLINE_SALVAGE: "1"
          QWEN_DISABLED: "1"
        run: PYTHONPATH=src python -m pytest -q tests/test_hs_preflight_api_contract.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/circuit-ai/circuit-ai-frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/circuit-ai/circuit-ai-frontend
        run: npm ci
      - name: Validate Preflight interface contract
        working-directory: apps/circuit-ai/circuit-ai-frontend
        run: npm run test:engineering-preflight
      - name: Type-check frontend
        working-directory: apps/circuit-ai/circuit-ai-frontend
        run: npm run typecheck
      - name: Build production frontend
        working-directory: apps/circuit-ai/circuit-ai-frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          HARDWARE_SPLICER_API_URL: "http://127.0.0.1:8090"
        run: npm run build
