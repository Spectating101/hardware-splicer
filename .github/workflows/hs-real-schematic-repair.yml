name: HS real pinned repair schematics
on:
  pull_request:
    paths:
      - 'src/hardware_splicer/restoration_schematic_grounding.py'
      - 'src/hardware_splicer/restoration_reasoning_agent.py'
      - 'examples/restoration_video_bench/real_schematic/**'
      - 'tests/test_restoration_real_schematic.py'
      - '.github/workflows/hs-real-schematic-repair.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-kicad-source-and-guardrails:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . 'pytest>=8,<10'
      - name: Verify pinned source, source graph, revision restrictions and safety
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q \
            tests/test_restoration_real_schematic.py \
            tests/test_restoration_reasoning_agent.py \
            tests/test_restoration_numeric_truth_gate.py
      - name: Verify no untracked source files or model billing needed
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          d=Path('examples/restoration_video_bench/real_schematic')
          m=json.loads((d/'source_gb_dmg_manifest.json').read_text())
          assert hashlib.sha256((d/'dmg_netlist_snapshot.json').read_bytes()).hexdigest()==m['derived_snapshot_sha256']
          assert m['commit']=='032eb9c2578125b157ab88048113b2d52663b819'
          assert m['license'].startswith('CC-BY-4.0')
          print('Source hash validated; live KiCad reexport verified separately on Optiplex')
          PY
