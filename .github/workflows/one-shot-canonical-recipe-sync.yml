name: One-shot canonical recipe sync

on:
  push:
    branches:
      - agent/canonical-recipe-sync-20260811

permissions:
  contents: write

jobs:
  regenerate-canonical-recipes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/circuit-ai/circuit-ai-frontend/package-lock.json

      - name: Install frontend toolchain
        working-directory: apps/circuit-ai/circuit-ai-frontend
        run: npm ci

      - name: Regenerate and verify canonical recipes
        shell: bash
        run: |
          set -euo pipefail
          node scripts/export_catalog_recipes.cjs
          node scripts/verify_catalog_parity.cjs
          git diff --check
          git diff -- src/hardware_splicer/data/catalog_recipes.json

      - name: Commit canonical generated truth and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-canonical-recipe-sync.yml
          git config user.name 'hardware-splicer-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add src/hardware_splicer/data/catalog_recipes.json
          git commit -m 'Regenerate catalog recipes from canonical frontend source'
          git push origin HEAD:${GITHUB_REF_NAME}
