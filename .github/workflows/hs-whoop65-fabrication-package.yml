name: HS WHOOP65 — Deliver actual printable drone fabrication package
on:
  pull_request:
    paths:
      - "examples/drone_lab/**"
      - ".github/workflows/hs-whoop65-fabrication-package.yml"
  workflow_dispatch:
jobs:
  deliver-physical-build-files:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch published physically built original 65 mm airframe (reuse, do not reinvent)
        run: |
          git init .cache/whoop65-original
          git -C .cache/whoop65-original remote add origin https://github.com/vsergeev/3d-parametric-whoop.git
          git -C .cache/whoop65-original fetch --depth 1 origin 13cf8c2909de18afe5ddc95b091026e6f11f8e8a
          git -C .cache/whoop65-original checkout --detach FETCH_HEAD
      - name: Package original frame, canopy, harness, editable OpenSCAD, actual Atech FreeCAD STEP/FCStd/STL, BOM
        run: |
          python3 examples/drone_lab/cad/package_whoop65_fabrication.py \
            --upstream .cache/whoop65-original \
            --out .cache/HS_WHOOP65_FULL_FABRICATION_HANDOFF.zip
          unzip -l .cache/HS_WHOOP65_FULL_FABRICATION_HANDOFF.zip | tail -24
      - name: Downloadable manufacturing package (not a simulated score)
        uses: actions/upload-artifact@v4
        with:
          name: HS-WHOOP65-physical-drone-frame-printables-step-fcstd-bom
          path: .cache/HS_WHOOP65_FULL_FABRICATION_HANDOFF.zip
          if-no-files-found: error
          retention-days: 90
