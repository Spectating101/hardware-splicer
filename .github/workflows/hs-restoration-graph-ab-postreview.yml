name: HS restoration A/B postreview proof
on:
  pull_request:
    paths:
      - 'examples/restoration_video_bench/diversity/score_graph_ab_postreview.py'
      - 'examples/restoration_video_bench/diversity/GRAPH_AB_POSTREVIEW.md'
      - 'examples/restoration_video_bench/diversity/evidence/graph_ab_postreview_annotations.json'
      - 'examples/restoration_video_bench/diversity/evidence/graph_ab_postreview_score.json'
      - 'examples/restoration_video_bench/diversity/evidence/graph_ab_review_source_PR321.json'
      - 'tests/test_restoration_graph_ab_postreview.py'
      - '.github/workflows/hs-restoration-graph-ab-postreview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixed-source-nonindependent-scoring:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . 'pytest>=8,<10'
      - name: Verify every review reference and tamper protection, no AI usage
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q \
            tests/test_restoration_graph_ab_postreview.py \
            tests/test_restoration_graph_ab.py \
            tests/test_restoration_reasoning_agent.py
      - name: Recalculate source-locked review score
        run: |
          python examples/restoration_video_bench/diversity/score_graph_ab_postreview.py \
            --predictions examples/restoration_video_bench/diversity/evidence/graph_ab_six_live.json \
            --review examples/restoration_video_bench/diversity/evidence/graph_ab_postreview_annotations.json \
            --creator-outcomes examples/restoration_video_bench/diversity/evidence/graph_ab_review_source_PR321.json \
            --out /tmp/graph_ab_postreview_ci.json
