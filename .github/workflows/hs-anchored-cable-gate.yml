name: HS anchored cable guides and display compatibility
on:
  pull_request:
    paths:
      - 'src/hardware_splicer/functional_hinge_cable_anchors.py'
      - 'examples/functional_hinge_cable_anchors/**'
      - 'tests/test_functional_hinge_cable_anchors.py'
      - '.github/workflows/hs-anchored-cable-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-cad-source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual CadQuery BRep, mesh and HS
        run: |
          python -m pip install -e .
          python -m pip install 'cadquery==2.6.1' 'trimesh==4.12.2' 'pytest>=8,<10'
      - name: Replay source-anchored wire collision blockers and hinge regression
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q \
            tests/test_functional_hinge_cable_anchors.py \
            tests/test_functional_hinge_retention.py \
            tests/test_functional_hinge_assembly.py
          python examples/functional_hinge_cable_anchors/run.py --audit-only
          python examples/functional_hinge_cable_anchors/slice_mounts.py --audit-only
      - name: Regenerate fresh CAD from the same source without overwriting published evidence
        env:
          PYTHONPATH: src
        run: |
          python examples/functional_hinge_cable_anchors/run.py \
            --out /tmp/hs_fresh_anchor_CI
  independent-real-prusaslicer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Re-slice all four nominal printed parts in native PrusaSlicer
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo debian:trixie bash -lc '
            set -e
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
              --no-install-recommends prusa-slicer python3 ca-certificates >/tmp/prusa-install.log
            python3 examples/functional_hinge_cable_anchors/slice_mounts.py \
              --slicer /usr/bin/prusa-slicer \
              --out /tmp/hs_mount_gcode_fresh \
              --receipt /tmp/hs_mount_slicer_audit.json
            python3 examples/functional_hinge_cable_anchors/slice_mounts.py \
              --receipt /tmp/hs_mount_slicer_audit.json --audit-only
          '
