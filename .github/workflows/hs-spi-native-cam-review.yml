name: SPI Reference — Fresh KiCad 9 CAM Review

on:
  push:
    branches:
      - experiment/hs-spi-native-cam-review-20261022
  pull_request:
    branches:
      - experiment/hs-spi-reference-handoff-20261022
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout canonical sources
        uses: actions/checkout@v4

      - name: Set up Python for independent auditors
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run archive auditor negative tests without KiCad
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_spi_native_cam_review.py tests/test_spi_reference_handoff.py tests/test_reference_device_dossier.py

      - name: Install and verify native KiCad 9 environment
        run: |
          set -euo pipefail
          retry() {
            local attempts=0
            until "$@"; do
              attempts=$((attempts + 1))
              if [ "$attempts" -ge 3 ]; then
                echo "External KiCad dependency unavailable after 3 attempts" >&2
                return 1
              fi
              sleep $((10 * attempts))
            done
          }
          retry sudo apt-get update
          sudo apt-get install -y software-properties-common
          retry sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
          retry sudo apt-get update
          retry sudo apt-get install --yes --no-install-recommends kicad kicad-symbols kicad-footprints
          kicad-cli --version | tee "$RUNNER_TEMP/kicad-cli-version.txt"
          grep -E '^9\.' "$RUNNER_TEMP/kicad-cli-version.txt"
          /usr/bin/python3 -c 'import pcbnew; print("Native pcbnew:", pcbnew.Version()); assert pcbnew.Version().startswith("9.")'
          test -f /usr/share/kicad/symbols/Timer.kicad_sym
          test -d /usr/share/kicad/footprints/Package_SO.pretty

      - name: Rerun native ERC DRC schematic-board parity and ground checks
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/spi-native-review/native-reports"
          /usr/bin/python3 hardware/reference_designs/spi_flash_adapter_v1/verify_design.py \
            --report-dir "$RUNNER_TEMP/spi-native-review/native-reports" \
            | tee "$RUNNER_TEMP/spi-native-review/native-verifier.json"

      - name: Export native Gerber NC drill placement PDFs and hash-sealed package
        run: |
          set -euo pipefail
          /usr/bin/python3 hardware/reference_designs/spi_flash_adapter_v1/build_package.py \
            --output "$RUNNER_TEMP/spi-native-review/spi-flash-adapter-review.zip"
          /usr/bin/python3 hardware/reference_designs/spi_flash_adapter_v1/build_package.py \
            --output "$RUNNER_TEMP/spi-native-review/spi-flash-adapter-review-repeat.zip"
          cmp "$RUNNER_TEMP/spi-native-review/spi-flash-adapter-review.zip" \
              "$RUNNER_TEMP/spi-native-review/spi-flash-adapter-review-repeat.zip"
          sha256sum "$RUNNER_TEMP/spi-native-review/spi-flash-adapter-review.zip" \
            | tee "$RUNNER_TEMP/spi-native-review/ZIP_SHA256SUMS.txt"

      - name: Independently audit CAM source consistency and release boundaries
        run: |
          set -euo pipefail
          python scripts/audit_spi_native_cam.py \
            "$RUNNER_TEMP/spi-native-review/spi-flash-adapter-review.zip" \
            --out "$RUNNER_TEMP/spi-native-review/NATIVE_CAM_AUDIT.json"
          python scripts/audit_spi_reference.py --out "$RUNNER_TEMP/spi-native-review/source-audit"

      - name: Preserve fresh KiCad review evidence (not build authorization)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spi-native-kicad9-review-evidence
          path: ${{ runner.temp }}/spi-native-review/
          if-no-files-found: warn
