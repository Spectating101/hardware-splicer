name: HS CM5 - V2.21 Auxiliary 5V and Boot Power Controls
on:
  pull_request:
    paths:
      - 'scripts/hs_cm5_power_boot_bringup.py'
      - 'src/hardware_splicer/cm5_power_boot_gate.py'
      - 'tests/test_cm5_power_boot_gate.py'
      - 'examples/cyberdeck/compute_carrier/cm5_reference/bringup_candidate/**'
      - '.github/workflows/hs-cm5-power-boot-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-kicad-actual-netlist-and-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e . 'pytest>=8,<10'
      - name: Prove all source-gated upstream and new electrical invariants
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q \
            tests/test_compute_carrier_reference_gate.py \
            tests/test_cm5_pinout_audit.py \
            tests/test_cm5_reference_board_netmap.py \
            tests/test_cm5_connected_bench_schematic.py \
            tests/test_cm5_power_usb_reference_gate.py \
            tests/test_cm5_sgm2590_successor_gate.py \
            tests/test_cm5_integrated_reference_gate.py \
            tests/test_cm5_power_boot_gate.py
      - name: Re-generate same editable schematic from tracked source
        run: |
          python scripts/hs_cm5_power_boot_bringup.py
          git diff --exit-code -- \
            examples/cyberdeck/compute_carrier/cm5_reference/bringup_candidate/CM5_POWER_BOOT_ELECTRIC_NOT_FOR_FAB.kicad_sch \
            examples/cyberdeck/compute_carrier/cm5_reference/bringup_candidate/bringup_manifest.json
      - name: Independently verify native XML and all ERC-open findings
        env:
          PYTHONPATH: src
        run: |
          python -m hardware_splicer.cm5_power_boot_gate \
            --candidate examples/cyberdeck/compute_carrier/cm5_reference/bringup_candidate/BRINGUP_NATIVE_NETLIST.xml \
            --upstream examples/cyberdeck/compute_carrier/cm5_reference/integrated_candidate/INTEGRATED_NATIVE_NETLIST.xml \
            --pinout examples/cyberdeck/compute_carrier/cm5_reference/vendor_pin_names.json \
            --erc examples/cyberdeck/compute_carrier/cm5_reference/bringup_candidate/BRINGUP_ERC_OPEN.txt \
            --baseline-erc examples/cyberdeck/compute_carrier/cm5_reference/integrated_candidate/INTEGRATED_ERC_OPEN.txt \
            --manifest examples/cyberdeck/compute_carrier/cm5_reference/bringup_candidate/bringup_manifest.json \
            --output /tmp/hs_cm5_power_boot_receipt.json
          cmp /tmp/hs_cm5_power_boot_receipt.json \
            examples/cyberdeck/compute_carrier/cm5_reference/bringup_candidate/bringup_validation.json
      - name: Store actual KiCad export, source and open ERC
        uses: actions/upload-artifact@v4
        with:
          name: HS-CM5-AUX5V-KEYS-ELECTRICAL-NO-FAB
          retention-days: 30
          path: |
            examples/cyberdeck/compute_carrier/cm5_reference/bringup_candidate/CM5_POWER_BOOT_ELECTRIC_NOT_FOR_FAB.kicad_sch
            examples/cyberdeck/compute_carrier/cm5_reference/bringup_candidate/BRINGUP_NATIVE_NETLIST.xml
            examples/cyberdeck/compute_carrier/cm5_reference/bringup_candidate/BRINGUP_ERC_OPEN.txt
            /tmp/hs_cm5_power_boot_receipt.json
