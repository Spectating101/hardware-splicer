name: HS raw restoration diversity (pre-outcome)
on:
  pull_request:
    paths:
      - '.github/workflows/hs-restoration-raw-diversity.yml'
      - 'examples/restoration_video_bench/diversity/**'
      - 'tests/test_restoration_diversity.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pre-outcome-narrative-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . 'pytest>=8,<10'
      - name: Regenerate source-separated baseline
        env:
          PYTHONPATH: src
        run: |
          python examples/restoration_video_bench/diversity/run_diversity.py \
            --out examples/restoration_video_bench/diversity/evidence/raw_rule_baseline.json \
            --agent-packet examples/restoration_video_bench/diversity/evidence/open_agent_packet.json
          git diff --exit-code -- examples/restoration_video_bench/diversity/evidence/raw_rule_baseline.json examples/restoration_video_bench/diversity/evidence/open_agent_packet.json
      - name: Verify nine-device source split
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_restoration_diversity.py
      - name: Print preserved GPT-6 external control SHA
        run: sha256sum examples/restoration_video_bench/diversity/evidence/gpt6_text_control_preoutcome.json
