name: HS numeric source provenance and condition gate
on:
  pull_request:
    paths:
      - 'src/hardware_splicer/restoration_source_numeric_ledger.py'
      - 'src/hardware_splicer/restoration_numeric_case.py'
      - 'src/hardware_splicer/restoration_reasoning_agent.py'
      - 'examples/restoration_video_bench/real_schematic/source_numeric_claims*'
      - 'examples/restoration_video_bench/real_schematic/run_numeric_source_ab.py'
      - 'examples/restoration_video_bench/real_schematic/NUMERIC_SOURCE_PROVENANCE.md'
      - 'tests/test_restoration_numeric_source_ledger.py'
      - '.github/workflows/hs-restoration-source-numeric-ledger.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  declarations-are-not-measurements:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . 'pytest>=8,<10'
      - name: Source-bound numeric trust, synthetic source windows and no-gold model evidence
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q \
            tests/test_restoration_numeric_source_ledger.py \
            tests/test_restoration_numeric_truth_gate.py \
            tests/test_restoration_board_action_gate.py \
            tests/test_restoration_real_schematic.py
      - name: Check frozen low-authority numeric evidence without source download
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("examples/restoration_video_bench/real_schematic")
          d=json.loads((root/"source_numeric_claims_validated.json").read_text())
          assert d["source_count"]==2
          assert d["claim_count"]==6
          assert d["source_authority_ceiling"]=="declared"
          assert all(c["authority"]=="declared" for c in d["claims"])
          assert not any(c["measured_by_HS"] for c in d["claims"])
          assert not d["board_identity_independently_verified"]
          p=root/"numeric_source_ab_live.json"
          if p.exists():
              r=json.loads(p.read_text())
              assert r["complete"] and len(r["cases"])==2
              assert r["protocol"]["creator_outcome_or_repair_method_never_loaded"]
              for case in r["cases"]:
                  assert case["arms"]["plain"]["evidence_sha256"]==case["evidence_sha256"]
                  assert case["arms"]["hs_numeric_source"]["evidence_sha256"]==case["evidence_sha256"]
                  assert case["arms"]["plain"]["repair_authorized"] is False
                  assert case["arms"]["hs_numeric_source"]["repair_authorized"] is False
          PY
