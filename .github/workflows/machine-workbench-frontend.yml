name: Machine Workbench Frontend

on:
  pull_request:
    paths:
      - 'apps/circuit-ai/circuit-ai-frontend/**'
      - '.github/workflows/machine-workbench-frontend.yml'
  push:
    branches:
      - 'feat/machine-workbench-v0-20260829'
    paths:
      - 'apps/circuit-ai/circuit-ai-frontend/**'
      - '.github/workflows/machine-workbench-frontend.yml'

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/circuit-ai/circuit-ai-frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/circuit-ai/circuit-ai-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
