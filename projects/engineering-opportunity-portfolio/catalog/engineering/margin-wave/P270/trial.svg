<svg xmlns="http://www.w3.org/2000/svg" width="257mm" height="285mm" viewBox="0 0 257 285">
  <title>Three-lane label liner dispenser</title>
  <style>text{font:4px sans-serif;fill:#18323a} .part,.dim,.test{fill:none;stroke:#22424a;stroke-width:.4}.part{fill:#dfebeb;fill-opacity:.4}.dim{stroke:#13746a}.test{stroke:#a54b25;stroke-dasharray:2 1}</style>
  <rect id="roll-0" class="part" x="21" y="22" width="22" height="78" />
  <rect id="liner-0" class="test" x="21" y="101" width="22" height="29" />
  <line id="feed-0" class="dim" x1="32.0" y1="101" x2="32.0" y2="139" />
  <rect id="divider-0" class="part" x="43.5" y="22" width="2" height="82" />
  <rect id="roll-1" class="part" x="46" y="22" width="34" height="78" />
  <rect id="liner-1" class="test" x="46" y="101" width="34" height="29" />
  <line id="feed-1" class="dim" x1="63.0" y1="101" x2="63.0" y2="139" />
  <rect id="divider-1" class="part" x="80.5" y="22" width="2" height="82" />
  <rect id="roll-2" class="part" x="83" y="22" width="41" height="78" />
  <rect id="liner-2" class="test" x="83" y="101" width="41" height="29" />
  <line id="feed-2" class="dim" x1="103.5" y1="101" x2="103.5" y2="139" />
  <line id="peel-edge" class="part" x1="17" y1="139" x2="131" y2="139" />
  <circle id="roll-end" class="part" cx="43" cy="196" r="39.0" />
  <circle id="core" class="dim" cx="43" cy="196" r="12.5" />
  <circle id="shaft" class="test" cx="43" cy="196" r="7.0" />
  <line id="incoming" class="dim" x1="54" y1="219" x2="111" y2="220" />
  <line id="peel-liner" class="test" x1="111" y1="220" x2="65" y2="251" />
  <line id="label-continue" class="part" x1="111" y1="220" x2="161" y2="219" />
  <text x="18" y="260">Three assumed widths [22, 34, 41]; dividers use 3 pitch allowance</text>
  <text x="18" y="271">Hand-pull the liner down over a smooth rigid edge. Verify the release angle with real stock.</text>
</svg>
