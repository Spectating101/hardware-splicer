<svg xmlns="http://www.w3.org/2000/svg" width="250mm" height="190mm" viewBox="0 0 250 190">
  <title>Cabinet handle drilling layout, actual size</title>
  <style>text{font:4px sans-serif;fill:#103341} .part,.tool,.test{stroke:#2a4148;stroke-width:.35;fill:none}.part{fill:#dce9e9;fill-opacity:.45}.tool{stroke:#006557}.test{stroke:#aa4c22;stroke-dasharray:2 1}</style>
  <rect id="panel" class="part" x="15" y="20" width="213.4" height="101.85" />
  <line id="center" class="test" x1="121.7" y1="20" x2="121.7" y2="121.85" />
  <circle id="drill-0-0" class="tool" cx="75.14" cy="41.34" r="2.425" />
  <circle id="drill-0-1" class="tool" cx="168.26" cy="41.34" r="2.425" />
  <text x="83.14" y="37.34">96 centers at 22 from top edge</text>
  <circle id="drill-1-0" class="tool" cx="59.62" cy="56.86" r="2.425" />
  <circle id="drill-1-1" class="tool" cx="183.78" cy="56.86" r="2.425" />
  <text x="67.62" y="52.86">128 centers at 38 from top edge</text>
  <circle id="drill-2-0" class="tool" cx="44.1" cy="78.2" r="2.425" />
  <circle id="drill-2-1" class="tool" cx="199.3" cy="78.2" r="2.425" />
  <text x="52.099999999999994" y="74.19999999999999">160 centers at 60 from top edge</text>
  <line id="scale-x" class="tool" x1="15" y1="145" x2="112.0" y2="145" />
  <line id="scale-y" class="tool" x1="225" y1="30" x2="225" y2="127.0" />
  <text x="15" y="156">Calibration bars must both measure 100 mm before drilling</text>
  <text x="15" y="167">Print at actual size. Place top line on panel edge and centerline on cabinet mark.</text>
