<svg xmlns="http://www.w3.org/2000/svg" width="250mm" height="190mm" viewBox="0 0 250 190">
  <title>Cabinet handle drilling layout, actual size</title>
  <style>text{font:4px sans-serif;fill:#103341} .part,.tool,.test{stroke:#2a4148;stroke-width:.35;fill:none}.part{fill:#dce9e9;fill-opacity:.45}.tool{stroke:#006557}.test{stroke:#aa4c22;stroke-dasharray:2 1}</style>
  <rect id="panel" class="part" x="15" y="20" width="220" height="105" />
  <line id="center" class="test" x1="125" y1="20" x2="125" y2="125" />
  <circle id="drill-0-0" class="tool" cx="77.0" cy="42" r="2.5" />
  <circle id="drill-0-1" class="tool" cx="173.0" cy="42" r="2.5" />
  <text x="85.0" y="38">96 centers at 22 from top edge</text>
  <circle id="drill-1-0" class="tool" cx="61.0" cy="58" r="2.5" />
  <circle id="drill-1-1" class="tool" cx="189.0" cy="58" r="2.5" />
  <text x="69.0" y="54">128 centers at 38 from top edge</text>
  <circle id="drill-2-0" class="tool" cx="45.0" cy="80" r="2.5" />
  <circle id="drill-2-1" class="tool" cx="205.0" cy="80" r="2.5" />
  <text x="53.0" y="76">160 centers at 60 from top edge</text>
  <line id="scale-x" class="tool" x1="15" y1="145" x2="115" y2="145" />
  <line id="scale-y" class="tool" x1="225" y1="30" x2="225" y2="130" />
  <text x="15" y="156">Calibration bars must both measure 100 mm before drilling</text>
  <text x="15" y="167">Print at actual size. Place top line on panel edge and centerline on cabinet mark.</text>
</svg>
