  <circle id="clamp-0-0" class="test" cx="62" cy="29.0" r="12" />
  <rect id="shoe-0-1" class="test" x="413" y="45.0" width="50" height="25" />
  <circle id="clamp-0-1" class="test" cx="438" cy="29.0" r="12" />
