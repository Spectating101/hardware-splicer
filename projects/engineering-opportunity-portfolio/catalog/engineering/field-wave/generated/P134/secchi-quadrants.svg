<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="200mm" height="200mm" viewBox="0 0 200 200">
  <title>Secchi disk masking pattern</title>
  <path d="M 100.0 100.0 L 200.0 100.0 A 100.0 100.0 0 0 1 100.0 200.0 Z" fill="black" />
  <path d="M 100.0 100.0 L 100.0 200.0 A 100.0 100.0 0 0 1 0.0 100.0 Z" fill="white" />
  <path d="M 100.0 100.0 L 0.0 100.0 A 100.0 100.0 0 0 1 100.0 0.0 Z" fill="black" />
  <path d="M 100.0 100.0 L 100.0 0.0 A 100.0 100.0 0 0 1 200.0 100.0 Z" fill="white" />
</svg>