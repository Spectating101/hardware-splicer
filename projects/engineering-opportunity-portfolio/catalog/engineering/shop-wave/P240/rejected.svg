<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="259mm" height="588mm" viewBox="0 0 259 588">
  <title>P240 rejected shop drawing, millimetres</title>
  <style>text{font:4px sans-serif;fill:#162930} .heading{font:bold 5px sans-serif}.part,.bore,.guide,.limit{fill:none;stroke:#223842;stroke-width:.38}.bore{stroke:#00645c}.guide{stroke:#964314;stroke-dasharray:2 1}.limit{stroke:#a1384e;stroke-dasharray:1 1}.part{fill:#e6eef0;fill-opacity:.28}</style>
  <g data-view="offset-0" transform="translate(12 5)">
    <text x="0" y="4" class="heading">Plan with 4 mm hole offset</text>
    <g transform="translate(0 10)">
      <rect id="deck-0" class="part" x="0" y="0" width="150" height="130" />
      <rect id="host-0" class="limit" x="15" y="15" width="120" height="100" />
      <rect id="left-rail-0" class="part" x="8" y="15" width="18" height="100" />
      <rect id="right-rail-0" class="part" x="124" y="15" width="18" height="100" />
      <rect id="slot-0-0" class="bore" x="18" y="52" width="6" height="25" />
      <circle id="fastener-0-0" class="bore" cx="21" cy="60" r="2.5" />
      <rect id="slot-0-1" class="bore" x="18" y="52" width="6" height="25" />
      <circle id="fastener-0-1" class="bore" cx="21" cy="60" r="2.5" />
      <rect id="fence-0" class="part" x="10" y="56" width="130" height="10" />
      <rect id="strip-0" class="guide" x="0" y="32" width="150" height="24" />
      <circle id="punch-0" class="bore" cx="75" cy="52" r="2" />
      <line id="visibility-0" class="guide" x1="65" y1="52" x2="85" y2="52" />
    </g>
    <text x="0" y="150">Deck 150 × 130; synthetic host base 120 × 100; strip 24 wide</text>
  </g>
  <g data-view="offset-1" transform="translate(12 176)">
    <text x="0" y="4" class="heading">Plan with 8 mm hole offset</text>
    <g transform="translate(0 10)">
      <rect id="deck-1" class="part" x="0" y="0" width="150" height="130" />
      <rect id="host-1" class="limit" x="15" y="15" width="120" height="100" />
      <rect id="left-rail-1" class="part" x="8" y="15" width="18" height="100" />
      <rect id="right-rail-1" class="part" x="124" y="15" width="18" height="100" />
      <rect id="slot-1-0" class="bore" x="18" y="52" width="6" height="25" />
      <circle id="fastener-1-0" class="bore" cx="21" cy="64" r="2.5" />
      <rect id="slot-1-1" class="bore" x="18" y="52" width="6" height="25" />
      <circle id="fastener-1-1" class="bore" cx="21" cy="64" r="2.5" />
      <rect id="fence-1" class="part" x="10" y="60" width="130" height="10" />
      <rect id="strip-1" class="guide" x="0" y="36" width="150" height="24" />
      <circle id="punch-1" class="bore" cx="75" cy="52" r="2" />
      <line id="visibility-1" class="guide" x1="65" y1="52" x2="85" y2="52" />
    </g>
    <text x="0" y="150">Deck 150 × 130; synthetic host base 120 × 100; strip 24 wide</text>
  </g>
  <g data-view="offset-2" transform="translate(12 347)">
    <text x="0" y="4" class="heading">Plan with 12 mm hole offset</text>
    <g transform="translate(0 10)">
      <rect id="deck-2" class="part" x="0" y="0" width="150" height="130" />
      <rect id="host-2" class="limit" x="15" y="15" width="120" height="100" />
      <rect id="left-rail-2" class="part" x="8" y="15" width="18" height="100" />
      <rect id="right-rail-2" class="part" x="124" y="15" width="18" height="100" />
      <rect id="slot-2-0" class="bore" x="18" y="52" width="6" height="25" />
      <circle id="fastener-2-0" class="bore" cx="21" cy="68" r="2.5" />
      <rect id="slot-2-1" class="bore" x="18" y="52" width="6" height="25" />
      <circle id="fastener-2-1" class="bore" cx="21" cy="68" r="2.5" />
      <rect id="fence-2" class="part" x="10" y="64" width="130" height="10" />
      <rect id="strip-2" class="guide" x="0" y="40" width="150" height="24" />
      <circle id="punch-2" class="bore" cx="75" cy="52" r="2" />
      <line id="visibility-2" class="guide" x1="65" y1="52" x2="85" y2="52" />
    </g>
    <text x="0" y="150">Deck 150 × 130; synthetic host base 120 × 100; strip 24 wide</text>
  </g>
  <g data-view="shoe" transform="translate(12 518)">
    <text x="0" y="4" class="heading">Section of lift-off shoe through assumed host lip</text>
    <g transform="translate(0 10)">
      <rect id="shoe-deck" class="part" x="0" y="30" width="150" height="12" />
      <rect id="base-lip" class="guide" x="32" y="25" width="24" height="5" />
      <polygon id="clamp-shoe" class="part" points="16,30 16,17 44,17 44,24 22,24 22,30" />
      <circle id="shoe-bolt" class="bore" cx="19" cy="21" r="2.7" />
    </g>
    <text x="0" y="49">Lip 5; shoe throat 6; two opposed shoes</text>
  </g>
</svg>
