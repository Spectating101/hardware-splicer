      <rect id="hold-down-0" class="part" x="167" y="5" width="17" height="3" />
    </g>
    <text x="0" y="69">Track 140 × 44; shoe 52 × 42; blank length 32</text>
    <text x="0" y="75">Carrier backing shim sets 2.5; abrasive span x=34–104</text>
    <text x="156" y="29">Initial blank 7 × 12</text>
  </g>
