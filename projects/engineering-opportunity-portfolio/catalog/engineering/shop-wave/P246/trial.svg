<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="284mm" height="383mm" viewBox="0 0 284 383">
  <title>P246 trial shop drawing, millimetres</title>
  <style>text{font:4px sans-serif;fill:#162930} .heading{font:bold 5px sans-serif}.part,.bore,.guide,.limit{fill:none;stroke:#223842;stroke-width:.38}.bore{stroke:#00645c}.guide{stroke:#964314;stroke-dasharray:2 1}.limit{stroke:#a1384e;stroke-dasharray:1 1}.part{fill:#e6eef0;fill-opacity:.28}</style>
  <g data-view="set-0" transform="translate(12 5)">
    <text x="0" y="4" class="heading">Carrier plan at 2.5 mm finished thickness</text>
    <g transform="translate(0 10)">
      <rect id="track-0" class="part" x="0" y="0" width="140" height="44" />
      <rect id="abrasive-0" class="part" x="34" y="45" width="70" height="4" />
      <rect id="start-stop-0" class="part" x="15" y="4" width="5" height="20" />
