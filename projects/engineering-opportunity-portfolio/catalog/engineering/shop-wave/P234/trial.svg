<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="344mm" height="931mm" viewBox="0 0 344 931">
  <title>P234 trial shop drawing, millimetres</title>
  <style>text{font:4px sans-serif;fill:#162930} .heading{font:bold 5px sans-serif}.part,.bore,.guide,.limit{fill:none;stroke:#223842;stroke-width:.38}.bore{stroke:#00645c}.guide{stroke:#964314;stroke-dasharray:2 1}.limit{stroke:#a1384e;stroke-dasharray:1 1}.part{fill:#e6eef0;fill-opacity:.28}</style>
  <g data-view="plan" transform="translate(12 5)">
    <text x="0" y="4" class="heading">Base plan and slotted rail blank</text>
    <g transform="translate(0 10)">
      <rect id="base" class="part" x="0" y="0" width="320" height="160" />
      <rect id="post-foot-0" class="part" x="10" y="67.5" width="25" height="25" />
      <circle id="post-bolt-0" class="bore" cx="22.5" cy="80" r="3.3" />
      <rect id="post-foot-1" class="part" x="285" y="67.5" width="25" height="25" />
      <circle id="post-bolt-1" class="bore" cx="297.5" cy="80" r="3.3" />
      <rect id="rail-blank" class="part" x="10" y="175" width="300" height="30" />
      <rect id="anchor-slot" class="bore" x="55" y="186.5" width="210" height="7" />
    </g>
    <text x="0" y="225">Base 320 × 160; anchor slot 210 × 7</text>
  </g>
  <g data-view="cords-0" transform="translate(12 253)">
