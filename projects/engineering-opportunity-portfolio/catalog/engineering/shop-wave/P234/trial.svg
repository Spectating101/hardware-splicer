      <circle id="key-0-4" class="bore" cx="248" cy="15" r="2.5" />
      <circle id="washer-0-4" class="limit" cx="248" cy="15" r="8" />
      <line id="cord-0-4" class="guide" x1="248" y1="30" x2="248" y2="285" />
