<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KiCad Diff</title>
<script>
/* set the theme before first paint: a saved manual choice wins, otherwise
   follow the browser's prefers-color-scheme (default dark) */
(function () {
  try {
    var saved = localStorage.getItem("khd-theme");
    var light = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
    document.documentElement.dataset.theme = saved || (light ? "light" : "dark");
  } catch (e) { document.documentElement.dataset.theme = "dark"; }
})();
</script>
<style>
:root {
  --bg: #22262a; --panel: #2b3136; --panel2: #262b30; --border: #3d444b;
  --fg: #d9dce0; --fg-dim: #9aa1a8; --accent: #3f8cff; --accent-fg: #fff;
  --canvas-bg: #0f1214; --dot: #ffb020;
  --red: #ff4136; --green: #2ecc40; --both: #ffe14d;
}
:root[data-theme="light"] {
  --bg: #eceff1; --panel: #ffffff; --panel2: #f4f6f7; --border: #cfd6db;
  --fg: #24292e; --fg-dim: #6a737d; --accent: #2f7de1; --accent-fg: #fff;
  --canvas-bg: #14171a; --dot: #e08e00;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font: 13px/1.45 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg); color: var(--fg);
  display: flex; flex-direction: column; overflow: hidden;
}
button { font: inherit; color: inherit; }

/* ---------------- top bar ---------------- */
#topbar {
  display: flex; align-items: center; gap: 8px; padding: 6px 10px;
  background: var(--panel); border-bottom: 1px solid var(--border);
  flex: 0 0 auto; flex-wrap: wrap;
}
#topbar .title { font-weight: 600; font-size: 14px; white-space: nowrap; }
#topbar .subtitle { color: var(--fg-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 28ch; }
#topbar .spacer { flex: 1; }
.btn {
  background: var(--panel2); border: 1px solid var(--border); border-radius: 5px;
  padding: 4px 10px; cursor: pointer; user-select: none; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); }
.btn.active { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn-group { display: flex; }
.btn-group .btn { border-radius: 0; margin-left: -1px; }
.btn-group .btn:first-child { border-radius: 5px 0 0 5px; margin-left: 0; }
.btn-group .btn:last-child { border-radius: 0 5px 5px 0; }
#fadebox { display: none; align-items: center; gap: 6px; }
#fadebox input { width: 130px; accent-color: var(--accent); }
.pair-chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px;
  border: 1px solid var(--border); border-radius: 5px; background: var(--panel2);
  max-width: 22ch; overflow: hidden;
}
.pair-chip .sw { width: 9px; height: 9px; border-radius: 2px; flex: 0 0 auto; }
.pair-chip span.nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------------- main split ---------------- */
#main { display: flex; flex: 1 1 auto; min-height: 0; }
#sidebar {
  width: 292px; flex: 0 0 auto; background: var(--panel);
  border-right: 1px solid var(--border); display: flex; flex-direction: column;
  min-height: 0; overflow: hidden;
}
body.nosidebar #sidebar { display: none; }
.side-h {
  font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  color: var(--fg-dim); padding: 8px 10px 4px; display: flex; align-items: center; gap: 6px;
}
.side-h .tools { margin-left: auto; display: flex; gap: 4px; }
.side-h .mini {
  font-size: 11px; padding: 1px 7px; border: 1px solid var(--border);
  background: var(--panel2); border-radius: 4px; cursor: pointer; text-transform: none;
  letter-spacing: 0; color: var(--fg);
}
.side-h .mini:hover { border-color: var(--accent); }

#revlist { overflow-y: auto; flex: 0 1 auto; max-height: 45%; padding: 0 4px 6px; }
.rev-head, .rev-row {
  display: grid; grid-template-columns: 26px 26px 1fr auto; align-items: center;
  gap: 4px; padding: 2px 6px; border-radius: 4px;
}
.rev-head { color: var(--fg-dim); font-size: 11px; text-align: center; }
.rev-head .cA { color: var(--red); font-weight: 700; }
.rev-head .cB { color: var(--green); font-weight: 700; }
.rev-row:hover { background: var(--panel2); }
.rev-row input { justify-self: center; accent-color: var(--accent); cursor: pointer; margin: 0; }
.rev-row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: default; }
.rev-row .nm b { font-weight: 600; }
.rev-row .dt { color: var(--fg-dim); font-size: 11px; }

#layerlist, #sheetlist { overflow-y: auto; flex: 1 1 auto; padding: 0 4px 8px; }
#sheetlist { flex: 0 1 auto; max-height: 34%; }
body.schonly #sheetlist { flex: 1 1 auto; max-height: none; }
.layer-row {
  display: flex; align-items: center; gap: 7px; padding: 2px 8px; border-radius: 4px;
  cursor: pointer; user-select: none;
}
.layer-row:hover { background: var(--panel2); }
.layer-row.selected { background: rgba(63,140,255,.16); box-shadow: inset 2px 0 0 var(--accent); }
.layer-row.selected .nm { font-weight: 600; }
.layer-row input { accent-color: var(--accent); margin: 0; flex: 0 0 auto; }
.layer-row .sw { width: 12px; height: 12px; border-radius: 3px; flex: 0 0 auto; border: 1px solid rgba(128,128,128,.35); }
.layer-row .nm { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.layer-row .chg { color: var(--dot); font-size: 15px; line-height: 1; visibility: hidden; }
.layer-row.changed .chg { visibility: visible; }

#sideinfo {
  flex: 0 0 auto; border-top: 1px solid var(--border); padding: 6px 10px;
  color: var(--fg-dim); font-size: 11px; line-height: 1.5;
}
#sideinfo .tb-title { color: var(--fg); font-weight: 600; font-size: 12px; }
#sideinfo .tb-row { margin-top: 1px; }
#sideinfo .tb-k { color: var(--fg-dim); }
#sideinfo .tb-v { color: var(--fg); }
#sideinfo .tb-arrow { color: var(--fg-dim); padding: 0 2px; }
#sideinfo .tb-old { color: var(--red); }
#sideinfo .tb-new { color: var(--green); }
#sideinfo .gen { display: block; margin-top: 5px; opacity: .8; }

/* ---------------- canvas area ---------------- */
#viewport { flex: 1 1 auto; display: flex; min-width: 0; position: relative; background: var(--canvas-bg); }
.pane { position: relative; flex: 1 1 50%; min-width: 0; display: none; }
.pane.on { display: block; }
.pane canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
.pane canvas.panning { cursor: grabbing; }
.pane .pane-label {
  position: absolute; top: 8px; left: 8px; z-index: 2; pointer-events: none;
  background: rgba(0,0,0,.55); color: #eee; padding: 2px 9px; border-radius: 4px; font-size: 12px;
}
.pane .pane-label .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
#paneB { border-left: 1px solid var(--border); }
#loading {
  position: absolute; top: 8px; right: 8px; z-index: 3; display: none;
  background: rgba(0,0,0,.6); color: #ffd479; padding: 3px 10px; border-radius: 4px; font-size: 12px;
}
#fatal {
  position: absolute; inset: 0; z-index: 10; display: none; place-content: center;
  background: var(--canvas-bg); color: #ff8080; padding: 30px; text-align: center; font-size: 14px;
}

/* ---------------- status bar ---------------- */
#statusbar {
  flex: 0 0 auto; display: flex; align-items: center; gap: 16px; padding: 3px 10px;
  background: var(--panel); border-top: 1px solid var(--border);
  color: var(--fg-dim); font-size: 12px; flex-wrap: wrap;
}
#legend { display: none; align-items: center; gap: 10px; }
#legend .chip { display: inline-flex; align-items: center; gap: 4px; }
#legend .sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
#coords { min-width: 19ch; font-variant-numeric: tabular-nums; }
#zoomlvl { margin-left: auto; font-variant-numeric: tabular-nums; }
kbd {
  background: var(--panel2); border: 1px solid var(--border); border-bottom-width: 2px;
  border-radius: 3px; padding: 0 4px; font-size: 11px;
}
</style>
</head>
<body>
<div id="topbar">
  <button class="btn" id="btn-sidebar" title="Toggle sidebar">&#9776;</button>
  <span class="title" id="t-title"></span>
  <span class="subtitle" id="t-sub"></span>
  <span class="pair-chip" title=""><span class="sw" style="background:var(--red)"></span><span class="nm" id="chip-a"></span></span>
  <button class="btn" id="btn-swap" title="Swap A and B (S)">&#8645;</button>
  <span class="pair-chip" title=""><span class="sw" style="background:var(--green)"></span><span class="nm" id="chip-b"></span></span>
  <span class="spacer"></span>
  <span class="btn-group" id="modes">
    <button class="btn" data-mode="diff"  title="Red/green overlay diff (1)">Diff</button>
    <button class="btn" data-mode="fade"  title="Crossfade A/B (2)">Fade</button>
    <button class="btn" data-mode="a"     title="Show revision A only (3)">A</button>
    <button class="btn" data-mode="b"     title="Show revision B only (4)">B</button>
    <button class="btn" data-mode="sxs"   title="Side by side (5)">Split</button>
  </span>
  <span id="fadebox">A <input type="range" id="fade" min="0" max="100" value="50"> B</span>
  <button class="btn" id="btn-fit" title="Fit board to view (F)">Fit</button>
  <button class="btn" id="btn-png" title="Save current view as PNG">PNG</button>
  <button class="btn" id="btn-theme" title="Toggle light/dark theme">&#9681;</button>
</div>

<div id="main">
  <div id="sidebar">
    <div class="side-h">Revisions
      <span class="tools"><button class="mini" id="btn-adjacent" title="Select two neighbouring revisions">A&#8594;B</button></span>
    </div>
    <div id="revlist"></div>
    <div class="side-h" id="layers-h">Layers
      <span class="tools">
        <button class="mini" id="btn-l-all">All</button>
        <button class="mini" id="btn-l-none">None</button>
        <button class="mini" id="btn-l-chg" title="Show only layers that differ between A and B">Changed</button>
      </span>
    </div>
    <div id="layerlist"></div>
    <div class="side-h" id="sheets-h">Sheets</div>
    <div id="sheetlist"></div>
    <div id="sideinfo"></div>
  </div>

  <div id="viewport">
    <div class="pane on" id="paneA"><div class="pane-label" id="labelA"></div><canvas id="cA"></canvas></div>
    <div class="pane" id="paneB"><div class="pane-label" id="labelB"></div><canvas id="cB"></canvas></div>
    <div id="loading">loading&hellip;</div>
    <div id="fatal"></div>
  </div>
</div>

<div id="statusbar">
  <span id="coords"></span>
  <span id="legend">
    <span class="chip"><span class="sw" style="background:var(--red)"></span>only in A</span>
    <span class="chip"><span class="sw" style="background:var(--green)"></span>only in B</span>
    <span class="chip"><span class="sw" style="background:var(--both)"></span>unchanged</span>
  </span>
  <span>drag: pan &middot; wheel: zoom &middot; <kbd>F</kbd> fit &middot; <kbd>1</kbd>&ndash;<kbd>5</kbd> mode &middot; <kbd>S</kbd> swap &middot; click layer: board, to front &middot; click sheet: schematic &middot; dbl-click: solo</span>
  <span id="zoomlvl"></span>
</div>

function revLabel(r) {
  const rv = DATA.revs[r];
  return rv.worktree ? "worktree" : rv.name;
}
function revTitle(r) {
  const rv = DATA.revs[r];
  return rv.worktree ? "uncommitted working tree"
    : rv.short + " " + rv.date + " " + rv.author + "\n" + rv.subject;
}
function buildRevList() {
  const host = $("revlist");
  host.innerHTML = "";
  const head = document.createElement("div");
  head.className = "rev-head";
  head.innerHTML = '<span class="cA">A</span><span class="cB">B</span><span></span><span></span>';
  host.appendChild(head);
  /* newest first in the list; DATA.revs itself stays oldest -> newest */
  for (let i = NREV - 1; i >= 0; i--) {
    const rv = DATA.revs[i];
    const row = document.createElement("div");
    row.className = "rev-row";
    row.dataset.rev = i;
    row.title = revTitle(i);
    const ra = document.createElement("input");
    ra.type = "radio"; ra.name = "revA"; ra.checked = i === S.a;
    ra.addEventListener("change", () => { S.a = i; pairChanged(); });
    const rb = document.createElement("input");
    rb.type = "radio"; rb.name = "revB"; rb.checked = i === S.b;
    rb.addEventListener("change", () => { S.b = i; pairChanged(); });
    const nm = document.createElement("span");
    nm.className = "nm";
    nm.innerHTML = "<b></b> <span style='color:var(--fg-dim)'></span>";
    nm.children[0].textContent = revLabel(i);
    nm.children[1].textContent = rv.subject;
    const dt = document.createElement("span");
    dt.className = "dt"; dt.textContent = rv.date;
    row.append(ra, rb, nm, dt);
    host.appendChild(row);
  }
}
function layerChanged(l) {
  const ea = pcbEntry(S.a, l), eb = pcbEntry(S.b, l);
  if (!ea && !eb) return false;
  if (!ea || !eb) return true;
  return ea.h !== eb.h;
}
function sheetChanged(s) {
  const ea = schEntry(S.a, s), eb = schEntry(S.b, s);
  if (!ea && !eb) return false;
  if (!ea || !eb) return true;   /* page added or removed */
  return ea.h !== eb.h;
}
function buildLayerList() {
  const host = $("layerlist");
  host.innerHTML = "";
  PCB.layers.forEach((ly, i) => {
    const row = document.createElement("div");
    row.className = "layer-row";
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = S.layersOn[i];
    cb.addEventListener("click", (e) => e.stopPropagation());
    cb.addEventListener("dblclick", (e) => e.stopPropagation());
    cb.addEventListener("change", () => { setDoc("pcb"); S.layersOn[i] = cb.checked; scheduleRender(); });
    const sw = document.createElement("span");
    sw.className = "sw"; sw.style.background = ly.color;
    const nm = document.createElement("span");
    nm.className = "nm"; nm.textContent = ly.display;
    const chg = document.createElement("span");
    chg.className = "chg"; chg.textContent = "●"; chg.title = "differs between A and B";
    row.append(cb, sw, nm, chg);
    row.addEventListener("click", () => {          /* select only: never touches the checkbox */
      const wasPcb = S.doc === "pcb";
      setDoc("pcb");
      if (wasPcb) S.sel = S.sel === i ? -1 : i;    /* coming from the schematic just shows the board */
      else S.sel = i;
      refreshSelection();
      scheduleRender();
    });
    row.addEventListener("dblclick", () => {
      setDoc("pcb");
      const solo = S.layersOn.filter(Boolean).length === 1 && S.layersOn[i];
      S.sel = i;
      refreshSelection();
      setLayers(solo ? () => true : (j) => j === i);
    });
    host.appendChild(row);
  });
  refreshChangedDots();
}
function sheetDepth(sh) {
  return sh.display === "Root" ? 0 : sh.display.split(" / ").length;
}
function buildSheetList() {
  const host = $("sheetlist");
  host.innerHTML = "";
  SCH.sheets.forEach((sh, i) => {
    const row = document.createElement("div");
    row.className = "layer-row";
    row.style.paddingLeft = (8 + sheetDepth(sh) * 13) + "px";
    row.title = sh.display;
    const nm = document.createElement("span");
    nm.className = "nm";
    const parts = sh.display.split(" / ");
    nm.textContent = parts[parts.length - 1];
    const chg = document.createElement("span");
    chg.className = "chg"; chg.textContent = "●"; chg.title = "differs between A and B";
    row.append(nm, chg);
    row.addEventListener("click", () => { setDoc("sch"); setSheet(i); });
    host.appendChild(row);
  });
  refreshSheetSel();
  refreshChangedDots();
}
function setSheet(i) {
  if (i < 0 || i >= NSH) return;
  S.sheet = i;
  refreshSheetSel();
  getImage("sch", S.a, i);
  getImage("sch", S.b, i);
  fitView();                     /* pages are independent documents */
}
function refreshSheetSel() {
  /* a sheet is highlighted only while the schematic is on screen */
  [...$("sheetlist").children].forEach((row, i) =>
    row.classList.toggle("selected", S.doc === "sch" && i === S.sheet));
}
function refreshChangedDots() {
  if (PCB) [...$("layerlist").children].forEach((row, i) =>
    row.classList.toggle("changed", layerChanged(i)));
  if (SCH) [...$("sheetlist").children].forEach((row, i) =>
    row.classList.toggle("changed", sheetChanged(i)));
}
function refreshSelection() {
  [...$("layerlist").children].forEach((row, i) =>
    row.classList.toggle("selected", i === S.sel));
}
function setLayers(pred) {
  S.layersOn = PCB.layers.map((_, i) => !!pred(i));
  [...$("layerlist").children].forEach((row, i) => { row.querySelector("input").checked = S.layersOn[i]; });
  scheduleRender();
}
function syncRevRadios() {
  [...$("revlist").querySelectorAll(".rev-row")].forEach((row) => {
    const i = Number(row.dataset.rev);
    row.children[0].checked = i === S.a;
    row.children[1].checked = i === S.b;
  });
}
const esc = (s) => String(s).replace(/[&<>"]/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* one title-block field: a plain value, or "old -> new" when it changed A->B */
function tbField(a, b) {
  a = a || ""; b = b || "";
  if (!a && !b) return "";
  if (!a || !b || a === b) return '<span class="tb-v">' + esc(a || b) + "</span>";
  return '<span class="tb-old">' + esc(a) + '</span><span class="tb-arrow">→</span>'
       + '<span class="tb-new">' + esc(b) + "</span>";
}

/* Info block: the current document's KiCad title block (board and schematic
   carry their own), diffing changed fields between revisions A and B, with the
   generation/version line underneath. */
function renderSideInfo() {
  const src = S.doc === "pcb" ? PCB : SCH;
  const tbs = (src && src.titleBlocks) || [];
  const a = tbs[S.a] || {}, b = tbs[S.b] || {};
  let html = "";
  const title = tbField(a.title, b.title);
  if (title) html += '<div class="tb-title">' + title + "</div>";
  const parts = [];
  const rev = tbField(a.rev, b.rev);
  if (rev) parts.push('<span class="tb-k">rev</span> ' + rev);
  const date = tbField(a.date, b.date);
  if (date) parts.push(date);
  const company = tbField(a.company, b.company);
  if (company) parts.push(company);
  const comments = tbField((a.comments || []).join(", "), (b.comments || []).join(", "));
  if (comments) parts.push(comments);
  if (parts.length) html += '<div class="tb-row">' + parts.join(" · ") + "</div>";
  html += '<span class="gen">generated ' + esc(DATA.generated)
        + (DATA.kicadVersion ? " · KiCad " + esc(DATA.kicadVersion) : "")
        + " · " + NREV + " revisions</span>";
  $("sideinfo").innerHTML = html;
}
function pairChanged() {
  $("chip-a").textContent = revLabel(S.a);
  $("chip-b").textContent = revLabel(S.b);
  $("chip-a").parentElement.title = revTitle(S.a);
  $("chip-b").parentElement.title = revTitle(S.b);
  $("labelA").innerHTML = '<span class="sw" style="background:var(--red)"></span>A: ';
  $("labelA").append(revLabel(S.a));
  $("labelB").innerHTML = '<span class="sw" style="background:var(--green)"></span>B: ';
  $("labelB").append(revLabel(S.b));
  syncRevRadios();
  refreshChangedDots();
  renderSideInfo();
  if (S.doc === "pcb") {
    for (let l = 0; l < NLAY; l++) { getImage("pcb", S.a, l); getImage("pcb", S.b, l); }
  } else {
    getImage("sch", S.a, S.sheet); getImage("sch", S.b, S.sheet);
  }
  scheduleRender();
}
function setDoc(d) {
  if (S.doc === d || (d === "pcb" && !PCB) || (d === "sch" && !SCH)) return;
  /* swap the stored pan/zoom with the outgoing document's */
  const cur = { k: S.view.k, x: S.view.x, y: S.view.y, fitK: S.fitK, fitted: S.fitted };
  S.view = { k: otherView.k, x: otherView.x, y: otherView.y };
  S.fitK = otherView.fitK;
  S.fitted = otherView.fitted;
  Object.assign(otherView, cur);
  S.doc = d;
  refreshSheetSel();
  pairChanged();
  if (!S.fitted) fitView().then(() => { S.fitted = true; });
}
function setMode(m) {
  S.mode = m;
  [...$("modes").children].forEach((b) => b.classList.toggle("active", b.dataset.mode === m));
  $("fadebox").style.display = m === "fade" ? "inline-flex" : "none";
  $("legend").style.display = m === "diff" ? "inline-flex" : "none";
  scheduleRender();
}
$("modes").addEventListener("click", (e) => {
  const b = e.target.closest("[data-mode]");
  if (b) setMode(b.dataset.mode);
});
$("fade").addEventListener("input", (e) => { S.fade = e.target.value / 100; scheduleRender(); });
$("btn-swap").addEventListener("click", () => { [S.a, S.b] = [S.b, S.a]; pairChanged(); });
$("btn-adjacent").addEventListener("click", () => {
  if (S.b > 0) { S.a = S.b - 1; } else { S.b = S.a + 1 <= NREV - 1 ? S.a + 1 : NREV - 1; }
  pairChanged();
});
$("btn-fit").addEventListener("click", () => fitView());
$("btn-sidebar").addEventListener("click", () => {
  document.body.classList.toggle("nosidebar");
  scheduleRender();
});
$("btn-theme").addEventListener("click", () => {
  const root = document.documentElement;
  root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
  try { localStorage.setItem("khd-theme", root.dataset.theme); } catch (e) {}
  scheduleRender();
});
$("btn-l-all").addEventListener("click", () => { setDoc("pcb"); setLayers(() => true); });
$("btn-l-none").addEventListener("click", () => { setDoc("pcb"); setLayers(() => false); });
$("btn-l-chg").addEventListener("click", () => { setDoc("pcb"); setLayers((i) => layerChanged(i)); });
$("btn-png").addEventListener("click", () => {
  const sxs = S.mode === "sxs";
  const a = $("cA"), b = $("cB");
  const out = document.createElement("canvas");
  out.width = a.width + (sxs ? b.width : 0);
  out.height = a.height;
  const ctx = out.getContext("2d");
  ctx.drawImage(a, 0, 0);
  if (sxs) ctx.drawImage(b, a.width, 0);
  out.toBlob((blob) => {
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    const sheetTag = S.doc === "sch"
      ? "-" + SCH.sheets[S.sheet].display.replace(/[^\w.-]+/g, "_") : "";
    link.download = DATA.title + sheetTag + "-" + revLabel(S.a) + "-vs-" + revLabel(S.b) + ".png";
    link.click();
    setTimeout(() => URL.revokeObjectURL(link.href), 5000);
  });
});
window.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" && e.target.type !== "radio" && e.target.type !== "checkbox") return;
  const modes = { "1": "diff", "2": "fade", "3": "a", "4": "b", "5": "sxs" };
  if (modes[e.key]) setMode(modes[e.key]);
  else if (e.key === "f" || e.key === "F") fitView();
  else if (e.key === "s" || e.key === "S") { [S.a, S.b] = [S.b, S.a]; pairChanged(); }
});

/* ---------------- boot ---------------- */
/* theme was applied pre-paint in <head>; keep following the system setting for
   as long as the user has not made a manual choice (no saved override) */
try {
  window.matchMedia("(prefers-color-scheme: light)").addEventListener("change", (e) => {
    if (localStorage.getItem("khd-theme")) return;
    document.documentElement.dataset.theme = e.matches ? "light" : "dark";
    scheduleRender();
  });
} catch (e) {}
document.title = DATA.title + " — KiCad diff";
$("t-title").textContent = DATA.title;
$("t-sub").textContent = DATA.repo + " / " + DATA.board;
if (!PCB && !SCH) { fatal("No documents in this file."); return; }
if (!PCB) {
  $("layers-h").style.display = "none";
  $("layerlist").style.display = "none";
  document.body.classList.add("schonly");
}
if (!SCH) {
  $("sheets-h").style.display = "none";
  $("sheetlist").style.display = "none";
}
buildRevList();
if (PCB) buildLayerList();
if (SCH) buildSheetList();
setMode("diff");
pairChanged();
fitView().then(() => { S.fitted = true; });
})();
</script>
</body>
</html>
