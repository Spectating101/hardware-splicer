[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hardware-splicer"
version = "1.1.0"
description = "Self-hosted hardware bring-up workbench: donor intake, design verification, bench gates, PROJECT_PACKAGE"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Hardware-Splicer" }]
dependencies = [
  "fastapi>=0.110",
  "fonttools>=4",
  "uvicorn>=0.27",
  "httpx>=0.27",
  "beautifulsoup4>=4.12,<5",
  "pillow>=10.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "python-multipart>=0.0.9",
  "pypdf>=5,<7",
  "python-dotenv>=1.0",
  "loguru>=0.7",
]

[project.optional-dependencies]
# Historical compile-engine MCP surface.  Keep its v1 SDK range explicit so a
# fresh install cannot silently resolve the breaking v2 API.
mcp = ["mcp>=1.2,<2"]
# Canonical whole-product MCP gateway targets the current stable SDK line.
backend-mcp = ["mcp>=2,<3"]
# Core and full regression workflows collect signed-worker tests; include its test dependency.
dev = ["pytest>=8.0", "httpx>=0.27", "jinja2>=3.1", "cryptography>=42,<60"]
# Signed, opt-in read-only workstation workers; not needed by base HS.
worker = ["cryptography>=42,<60"]
# Bounded structural FEM screening; intentionally optional for lighter installs.
physics = ["numpy>=1.26", "scipy>=1.11"]
# Gmsh's OCC kernel meshes STEP and closed STL for local structural screening.
cad-meshing = ["gmsh>=4.14,<5"]
# Independent numerical implementation cross-check (optional, not a product runtime dependency).
physics-validation = ["scikit-fem>=11,<12"]
# Native CAD paths: STEP/STL generation, hinge and print-geometry studies, and the
# project-intake STEP assembly. Without these, those paths fail at import time.
cad = ["cadquery>=2.5", "trimesh>=4"]
# Measured scene fit (scene_fit.py, run in the native CAD interpreter): part-to-part interference
# volumes need manifold3d; clearances need scipy and trimesh.
fit = ["trimesh>=4", "numpy>=2,<3", "scipy>=1.14", "manifold3d>=3.5"]
# Registered cyberdeck and plotter studies. These do not require PyBullet.
digital = ["cadquery>=2.5", "trimesh>=4", "numpy>=2,<3", "matplotlib>=3.7,<4"]
# Digital HS-3G assembly, native physics, plots and independent artifact checks.
drone-sim = ["cadquery>=2.5", "trimesh>=4", "numpy>=2,<3", "scipy>=1.14", "pybullet==3.2.7", "matplotlib>=3.7,<4", "pillow>=10", "ezdxf>=1.3", "PyYAML>=6"]
# Optional copper-island engine. KiCad pcbnew can remain in a separate native
# interpreter while this pure Shapely solver runs in the HS environment.
keyboard-splice = ["shapely>=2.1,<3", "numpy>=1.26,<3"]

[project.scripts]
hs-doctor = "hardware_splicer.cli_entry:main_doctor"
hs-serve = "hardware_splicer.cli_entry:main_serve"
hs-mcp = "hardware_splicer.cli_entry:main_mcp"
hs-backend-mcp = "hardware_splicer.cli_entry:main_backend_mcp"
hs-capability-freeze = "hardware_splicer.cli_entry:main_capability_freeze"
hs-derive = "hardware_splicer.cli_entry:main_derive"
hs-mechanical = "hardware_splicer.cli_entry:main_mechanical"
hs-open-repair = "hardware_splicer.open_repair_candidates:main"
hs-digital = "hardware_splicer.digital_engine_cli:main"
hs-policy = "hardware_splicer.policy_layer_cli:main"
hs-materials = "hardware_splicer.materials_cli:main"
hs-wiring = "hardware_splicer.wiring_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hardware_splicer = ["data/*.json", "data/firmware_application/*", "data/firmware_application/**/*", "ui_dist/*", "ui_dist/**/*", "data/third_party/**/*", "data/actuators/**/*", "data/drive/**/*", "data/propulsion/**/*", "data/parts/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
