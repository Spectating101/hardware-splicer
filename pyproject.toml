[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hardware-splicer"
version = "1.1.0"
description = "Self-hosted hardware bring-up workbench: donor intake, design verification, bench gates, PROJECT_PACKAGE"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Hardware-Splicer" }]
dependencies = [
  "fastapi>=0.110",
  "fonttools>=4",
  "uvicorn>=0.27",
  "httpx>=0.27",
  "beautifulsoup4>=4.12,<5",
  "pillow>=10.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "python-multipart>=0.0.9",
  "pypdf>=5,<7",
  "python-dotenv>=1.0",
  "loguru>=0.7",
]

[project.optional-dependencies]
# Historical compile-engine MCP surface.  Keep its v1 SDK range explicit so a
# fresh install cannot silently resolve the breaking v2 API.
mcp = ["mcp>=1.2,<2"]
# Canonical whole-product MCP gateway targets the current stable SDK line.
backend-mcp = ["mcp>=2,<3"]
dev = ["pytest>=8.0", "httpx>=0.27", "jinja2>=3.1"]
# Bounded structural FEM screening; optional on lightweight installations.
physics = ["numpy>=1.26", "scipy>=1.11"]
cad-meshing = ["gmsh>=4.14,<5"]
physics-validation = ["scikit-fem>=11,<12"]
# Optional GEOS/plane-geometry contact-patch integration for source-derived CAD.
physics-geometry = ["shapely>=2.1,<3"]
# Chemistry science backends are opt-in; practical chemistry uses core dependencies.
chemical = ["rdkit>=2024.9", "thermo>=0.4", "chemicals>=1.3"]
chemical-process = ["cantera>=3.1,<4"]
chemical-battery = ["pybamm>=26.4,<27"]
chemical-materials = ["pymatgen-core>=2026.7"]
chemical-fluids = ["CoolProp>=7.1,<8"]

[project.scripts]
hs-doctor = "hardware_splicer.cli_entry:main_doctor"
hs-serve = "hardware_splicer.cli_entry:main_serve"
hs-mcp = "hardware_splicer.cli_entry:main_mcp"
hs-backend-mcp = "hardware_splicer.cli_entry:main_backend_mcp"
hs-capability-freeze = "hardware_splicer.cli_entry:main_capability_freeze"
hs-derive = "hardware_splicer.cli_entry:main_derive"
hs-mechanical = "hardware_splicer.cli_entry:main_mechanical"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hardware_splicer = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
